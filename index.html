<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staffing Master — Sequoia Forest Products</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --orange: #EE7425; --rust: #AD4C25; --wine: #4B1A21;
      --cream: #EAD9CA; --ink: #27211E; --font: 'Montserrat', system-ui, sans-serif;
    }
    body { font-family: var(--font); background: #1a1410; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

    .top-bar { position: fixed; top: 0; left: 0; right: 0; height: 58px; background: var(--ink); display: flex; align-items: stretch; border-bottom: 2px solid var(--rust); z-index: 10; }
    .logo-block { background: var(--orange); display: flex; align-items: center; justify-content: center; padding: 0 16px; }
    .logo-block svg { height: 28px; width: auto; }
    .top-titles { display: flex; flex-direction: column; justify-content: center; padding: 0 18px; }
    .top-system { font-size: 9px; font-weight: 700; color: var(--orange); letter-spacing: 0.14em; text-transform: uppercase; }
    .top-page { font-size: 15px; font-weight: 700; color: white; margin-top: 1px; }

    .card { background: #231e1a; border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 44px 40px; width: 100%; max-width: 400px; text-align: center; margin-top: 20px; }

    .title { font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--orange); margin-bottom: 8px; }
    .divider { width: 40px; height: 2px; background: var(--rust); margin: 0 auto 20px; border-radius: 1px; }
    .subtitle { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 32px; line-height: 1.6; }

    .google-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; padding: 13px 20px; background: var(--orange); color: white; font-family: var(--font); font-size: 14px; font-weight: 700; border: none; border-radius: 7px; cursor: pointer; text-decoration: none; transition: background 0.15s; letter-spacing: 0.02em; }
    .google-btn:hover { background: var(--rust); }
    .google-icon { width: 18px; height: 18px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    .footer { margin-top: 28px; font-size: 11px; color: rgba(255,255,255,0.2); line-height: 1.6; }

    .error-msg { font-size: 12px; font-weight: 600; padding: 10px 14px; border-radius: 6px; margin-bottom: 20px; display: none; }
    .error-msg.show { display: block; }
    .error-msg.err { background: rgba(192,57,43,0.2); color: #e87070; }
    .error-msg.ok  { background: rgba(42,122,71,0.2); color: #6dc87e; }
  </style>
</head>
<body>

      </svg>
    </div>
    <div class="top-titles">
      <div class="top-system">Sequoia Forest Products</div>
      <div class="top-page">Staffing Master</div>
    </div>
  </div>

  <div class="card">
    <div class="title">HR Portal</div>
    <div class="divider"></div>
    <div class="subtitle">Sign in with your Sequoia Forest Products<br>Google Workspace account to continue.</div>

    <div class="error-msg" id="errorMsg"></div>

    <a href="/api/auth?action=login" class="google-btn">
      <span class="google-icon">
        <svg width="12" height="12" viewBox="0 0 24 24">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
      </span>
      Sign in with Google
    </a>

    <div class="footer">
      Access is restricted to @sequoiafp.com accounts.<br>
      Contact your administrator to request access.
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('error')) {
      const msg = document.getElementById('errorMsg');
      const errors = { unauthorized: 'Your account is not authorized. Contact your administrator.', auth_failed: 'Sign-in failed. Please try again.', no_code: 'Authentication was cancelled.' };
      msg.textContent = errors[params.get('error')] || 'An error occurred. Please try again.';
      msg.className = 'error-msg show err';
    }
    if (params.get('logged_out')) {
      const msg = document.getElementById('errorMsg');
      msg.textContent = 'You have been signed out.';
      msg.className = 'error-msg show ok';
    }
  </script>
</body>
</html>
