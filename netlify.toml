[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# session.js assembles the page from app.html and src/js/*.js at request time.
# The module paths are built from a manifest array rather than written as literal
# requires, so nothing can infer them — they have to be listed here or they are
# not in the function bundle at all.
[functions."session"]
  included_files = ["app.html", "src/js/*.js"]

# Birthday notifications — Mon-Thu. No Friday run: Thursday's 3-day look-ahead
# already covers Fri/Sat/Sun, so a Friday run would double-announce.
# Netlify cron is UTC: 13:30 UTC = 7:30 AM Mountain (MDT) / 6:30 AM (MST in winter).
[functions."birthday-notifications"]
  schedule = "30 13 * * 1-4"

# Payroll email ingestion — hourly, every day.
#
# The vendor sends the report at ~6:04 AM Pacific (13:04 UTC in summer, 14:04 in
# winter), but polling hourly means a delayed report still lands the same day
# instead of waiting until tomorrow. Each run searches only the "payroll import"
# Gmail label over a rolling 7-day window and skips any Message-ID already in
# processed_emails, so the repeat runs are cheap and re-processing is harmless.
#
# Weekends are included deliberately: maintenance crews work Fri-Sun, so those
# days produce real payroll data.
#
# :15 rather than :00 keeps this off the top-of-hour rush the birthday job and
# everyone else's crons sit on.
[functions."payroll-email-ingest"]
  schedule = "15 * * * *"

# Missed-delivery check — once daily at 19:00 UTC (12:00 PM PDT / 11:00 AM PST),
# well after the delivery window has closed, so a merely late report is not
# reported as a missing one.
#
# Nobody touches these emails by hand, so nobody would notice if they stopped
# arriving. This is the only thing that surfaces a broken pipeline. It escalates
# only on a missing Mon-Thu scheduled day; a quiet Fri/Sat/Sun is reported but
# not alerted, since nobody may have worked.
[functions."payroll-missed-check"]
  schedule = "0 19 * * *"

[[redirects]]
  from = "/auth/callback"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# publish = "." serves the whole repo tree, so the script modules would otherwise
# be fetchable one by one at /src/js/core.js and friends. They are only ever meant
# to reach a browser assembled by the session function, behind the session check,
# exactly as the inline script was. force = true because the files really do exist
# in the publish directory, and a rule without it would be shadowed by them.
[[redirects]]
  from = "/src/*"
  to = "/index.html"
  status = 404
  force = true

# Same reasoning for the test tree. publish = "." was serving all of tests/ —
# the suites, the workbook generators, and tests/fixtures/, which holds a real
# vendor payroll export with its values replaced. Nothing under tests/ is meant
# to be fetchable by a browser at all.
[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true

# force = true on both, and it is load-bearing rather than tidying.
#
# Netlify does not apply a redirect whose `from` matches a file that exists in
# the publish directory unless it is forced, and app.html sits at the publish
# root because publish = ".". Without force, /app.html was served as a STATIC
# file and never reached the session function at all — which is invisible while
# the script is inline, because core.js reads `window.__SFP_USER__ || {}` and
# simply renders no user name. It is not invisible now: the script lives in
# src/js and only the session function assembles it, so a static hit would serve
# a page with no application on it.
#
# It also means the page itself was never actually behind the session check.
# The API always was, so no data was exposed, but the gate this rule exists to
# enforce was not being enforced.
[[redirects]]
  from = "/app.html"
  to = "/.netlify/functions/session"
  status = 200
  conditions = {Cookie = ["sfp_session"]}
  force = true

[[redirects]]
  from = "/app.html"
  to = "/index.html"
  status = 302
  force = true

# Stale full copy of the pre-split app, publicly fetchable at /app.html.backup
# and outside the session check. Git holds the history, so the file has no job
# to do; 404 it now and delete it when convenient. The .sql files are
# development artefacts for the Supabase editor and have no reason to be served
# either.
[[redirects]]
  from = "/app.html.backup"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.sql"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/app.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store"
