[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

# Birthday notifications — Mon-Thu. No Friday run: Thursday's 3-day look-ahead
# already covers Fri/Sat/Sun, so a Friday run would double-announce.
# Netlify cron is UTC: 13:30 UTC = 7:30 AM Mountain (MDT) / 6:30 AM (MST in winter).
[functions."birthday-notifications"]
  schedule = "30 13 * * 1-4"

[[redirects]]
  from = "/auth/callback"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/app.html"
  to = "/.netlify/functions/session"
  status = 200
  conditions = {Cookie = ["sfp_session"]}

[[redirects]]
  from = "/app.html"
  to = "/index.html"
  status = 302

[[headers]]
  for = "/app.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store"
