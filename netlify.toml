# publish points at public/, NOT at the repo root, and that is the whole
# security posture of this file.
#
# It used to be publish = ".", which meant the default for every file in the
# repo was "served to the public internet, with no session check". Four things
# were found open that way in turn — src/js/*.js, the eleven .sql files,
# app.html.backup, and the whole tests/ tree — each time after the fact, and
# each fixed by adding another 404 redirect. A probe of the live site found 48
# of 69 tracked files being served, including every netlify/functions/*.js:
# /netlify/functions/db.js returned its real source to anyone who asked.
#
# One of those redirects never even worked. `from = "/*.sql"` sat here looking
# like protection while all eleven schema files were served, because Netlify's
# `*` is a trailing splat — "the rest of the path" — not an extension glob.
#
# With publish = "public", src/, tests/, netlify/, the .sql files, the docs and
# package.json are simply not in the deploy. Twenty redirect rules became
# unnecessary and were deleted. Adding a file to this repo now makes it private
# by default; making something public means deliberately putting it in public/.
#
# tests/public-exposure.test.js pins that: it fails if publish stops pointing
# at a subdirectory, or if anything unexpected appears in public/.
[build]
  functions = "netlify/functions"
  publish = "public"

[functions]
  node_bundler = "esbuild"

# session.js assembles the page from app.html and src/js/*.js at request time.
# The module paths are built from a manifest array rather than written as literal
# requires, so nothing can infer them — they have to be listed here or they are
# not in the function bundle at all.
[functions."session"]
  included_files = ["public/app.html", "src/js/*.js"]

# Birthday notifications — Mon-Thu. No Friday run: Thursday's 3-day look-ahead
# already covers Fri/Sat/Sun, so a Friday run would double-announce.
# Netlify cron is UTC: 13:30 UTC = 7:30 AM Mountain (MDT) / 6:30 AM (MST in winter).
[functions."birthday-notifications"]
  schedule = "30 13 * * 1-4"

# Payroll email ingestion — hourly, every day.
#
# The daily file is due at 8:00 AM Pacific (15:00 UTC in summer, 16:00 in
# winter) and the weekly file Mondays at 10:00 AM Pacific; see
# netlify/functions/timeclock-config.js. Polling hourly means a delayed file
# still lands the same day, and it is the only way a UTC cron can follow
# daylight saving. Each run searches only the "payroll import"
# Gmail label over a rolling 7-day window and skips any Message-ID already in
# processed_emails, so the repeat runs are cheap and re-processing is harmless.
#
# Weekends are included deliberately: maintenance crews work Fri-Sun, so those
# days produce real payroll data.
#
# :15 rather than :00 keeps this off the top-of-hour rush the birthday job and
# everyone else's crons sit on.
[functions."payroll-email-ingest"]
  schedule = "15 * * * *"

# Missed-delivery check — once daily at 19:00 UTC (12:00 PM PDT / 11:00 AM PST),
# well after the 8:00 AM delivery and its 9:00 AM missing-file alert, so a
# merely late report is not emailed as a missing one. The Alerts tab raises
# Daily file missing from 9:00 AM Pacific (alerts-evaluate, below).
#
# Nobody touches these emails by hand, so nobody would notice if they stopped
# arriving. This is the only thing that surfaces a broken pipeline. It escalates
# on EVERY missing day: BBSI sends the report seven days a week, so a Saturday
# with no data is a failed delivery rather than a quiet weekend. The daily
# schedule below already covers all seven.
# Alerts — every hour at :20, five minutes after the ingest's :15.
#
# Re-evaluates every condition on the Alerts tab: new employee numbers,
# thin days, zero-hour rows, active people with no hours, and the two
# missing-file alerts. Those two are why this is scheduled at all — a file that
# does NOT arrive produces no event, only a clock. Hourly because a UTC cron
# cannot follow daylight saving; alerts-lib decides whether 9:00 AM (daily) or
# Monday 11:00 AM (weekly) Pacific has passed.
[functions."alerts-evaluate"]
  schedule = "20 * * * *"

[functions."payroll-missed-check"]
  schedule = "0 19 * * *"

# Weekly manager overtime email — Monday, 19:30 UTC.
#
# 19:30 UTC is 12:30 PM Pacific in summer (PDT) and 11:30 AM in winter (PST).
# Netlify cron is UTC and does not shift with DST, so one of the two is what you
# get; both are late morning Monday.
#
# The hour exists to send the RECONCILED week. BBSI's weekly file — last week
# with punch corrections applied — is due at 10:00 AM Pacific Monday (17:00 UTC
# summer, 18:00 winter) and is collected on the next :15. Before it lands, the
# week is the daily snapshots, with every open punch frozen at 0.00. Move this
# earlier and managers act on the provisional figures the October payroll
# reconciliation found ~$22K short.
#
# It sends the week that just FINISHED (previous Mon-Sun), derived from the
# date rather than from the schedule — so a manual "Run now" on a Wednesday
# sends the same week this would have.
#
# If any day of that week has no hours, it sends nothing and alerts
# PAYROLL_ALERT_EMAIL instead. See ot-weekly-email-lib.js.
[functions."ot-weekly-email"]
  schedule = "30 19 * * 1"

[[redirects]]
  from = "/auth/callback"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# force = true on both /app.html rules, and it is load-bearing rather than
# tidying.
#
# Netlify does not apply a redirect whose `from` matches a file that exists in
# the publish directory unless it is forced, and app.html IS in the publish
# directory — it has to be, because these rules address it by URL. Without
# force, /app.html was served as a STATIC file and never reached the session
# function at all. That was invisible while the script was inline, because
# core.js reads `window.__SFP_USER__ || {}` and simply renders no user name. It
# is not invisible now: the modules live in src/js and only the session
# function assembles them, so a static hit would serve a page with no
# application on it.
#
# It also meant the page was never actually behind the session check. The API
# always was, so no data was exposed, but the gate these rules exist to enforce
# was not being enforced.
[[redirects]]
  from = "/app.html"
  to = "/.netlify/functions/session"
  status = 200
  conditions = {Cookie = ["sfp_session"]}
  force = true

[[redirects]]
  from = "/app.html"
  to = "/index.html"
  status = 302
  force = true

[[headers]]
  for = "/app.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-store"
