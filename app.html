<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="/icons/staffing-and-hr.svg">
  <title>Staffing Master — Sequoia Forest Products</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!--SESSION_DATA-->
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --orange:#EE7425;--rust:#AD4C25;--wine:#4B1A21;--gold:#EFBA62;--brick:#902423;--teal:#004C56;
      --nearBlk:#27211E;--cream:#EAD9CA;--bg:#F5F0EB;--surface:#FFFFFF;--surface2:#F0E8E0;
      --border:#DDD0C4;--muted:#9A8070;--text:#27211E;--textDim:#6B5448;
      --font:Montserrat,Arial,sans-serif;
    }
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

    /* HEADER — exact match to Maintenance System */
    .sfp-header{background:var(--nearBlk);border-bottom:2px solid var(--rust);position:sticky;top:0;z-index:50;}
    .sfp-header-inner{max-width:1300px;margin:0 auto;padding:0 20px;}
    .sfp-header-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 0;flex-wrap:wrap;gap:10;}
    .sfp-logo-row{display:flex;align-items:center;gap:14px;}
    .sfp-logo-block{background:var(--rust);border-radius:4px;padding:6px 12px;display:flex;align-items:center;}
    .sfp-logo-block img{height:28px;width:auto;}
    .sfp-title-block{display:flex;flex-direction:column;}
    .sfp-system-name{color:var(--orange);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;}
    .sfp-page-name{color:#F0E6DC;font-size:17px;font-weight:800;line-height:1.1;}
    .sfp-header-actions{display:flex;gap:8px;align-items:center;}
    .sfp-sync-status{font-size:11px;font-family:var(--font);}
    .sfp-sync-status.idle{color:#4A7C59;}
    .sfp-sync-status.saving{color:var(--orange);}
    .sfp-sync-status.error{color:var(--brick);}
    .sfp-user-pill{display:flex;align-items:center;gap:8px;}
    .sfp-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--rust);}
    .sfp-user-name{color:#94a3b8;font-size:12px;}
    .sfp-btn{font-family:var(--font);font-size:12px;font-weight:700;padding:8px 20px;border-radius:4px;cursor:pointer;border:none;background:var(--orange);color:#fff;}
    .sfp-btn:hover{background:var(--rust);}
    .sfp-btn-outline{background:none;border:1px solid #3D2E26;color:#F0E6DC;border-radius:4px;padding:6px 14px;font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;}
    .sfp-btn-outline:hover{border-color:var(--muted);}
    .sfp-btn-sm{font-size:11px;padding:5px 12px;}
    .sfp-sync-btn{font-family:var(--font);font-size:11px;font-weight:700;padding:6px 14px;border-radius:4px;cursor:pointer;border:none;background:var(--orange);color:#fff;}
    .sfp-sync-btn:hover{background:var(--rust);}
    .sfp-sync-btn.saving{background:transparent;color:var(--orange);border:1px solid var(--orange);}
    .sfp-sync-btn.saved{background:transparent;color:#4A7C59;border:1px solid #4A7C59;}

    /* NAV TABS — exact match */
    .sfp-tabs{display:flex;gap:2px;margin-top:12px;}
    .sfp-tab{padding:10px 16px;background:none;border:none;border-bottom:2px solid transparent;color:#94a3b8;cursor:pointer;font-size:13px;font-weight:400;font-family:var(--font);position:relative;transition:color .15s;}
    .sfp-tab.active{border-bottom-color:var(--orange);color:var(--orange);font-weight:600;}
    .sfp-tab:hover:not(.active){color:#cbd5e1;}

    /* CONTENT */
    .sfp-content{max-width:1300px;margin:0 auto;padding:24px 20px;}

    /* STAT CARDS */
    .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;}
    .stat-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
    .stat-value{font-size:26px;font-weight:800;color:var(--text);line-height:1;}
    .stat-sub{font-size:11px;color:var(--muted);margin-top:4px;}

    /* SECTION HEADER */
    .section-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--rust);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}

    /* TABLE */
    .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:24px;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{background:var(--surface2);color:var(--textDim);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;text-align:left;white-space:nowrap;}
    td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:var(--surface2);}

    /* BADGES */
    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
    .badge.active{background:#e8f5ec;color:#2a7a47;}
    .badge.inactive{background:var(--surface2);color:var(--muted);}
    .badge.en{background:#eef3fc;color:#3a5fa0;}
    .badge.es{background:#fef5e8;color:#9a600a;}
    .badge.disc{background:#fce8e8;color:var(--brick);}

    /* BUTTONS */
    .btn{font-family:var(--font);font-size:12px;font-weight:700;padding:6px 14px;border-radius:4px;cursor:pointer;}
    .btn-primary{background:var(--orange);color:#fff;border:none;}
    .btn-primary:hover{background:var(--rust);}
    .btn-outline{background:none;color:var(--rust);border:1px solid var(--border);}
    .btn-outline:hover{border-color:var(--orange);color:var(--orange);}
    .btn-sm{font-size:11px;padding:4px 10px;}

    /* SEARCH ROW */
    .search-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
    .search-row input,.search-row select{font-family:var(--font);font-size:13px;border:1px solid var(--border);border-radius:4px;padding:7px 12px;background:var(--surface);color:var(--text);}
    .search-row input{flex:1;min-width:200px;}
    .search-row input:focus,.search-row select:focus{outline:none;border-color:var(--orange);}

    /* WAGE BARS */
    .wage-wrap{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:24px;}
    .wage-sec-hdr{background:var(--surface2);padding:7px 16px;font-size:10px;font-weight:700;color:var(--rust);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);}
    .wage-row{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:12.5px;}
    .wage-row:last-child{border-bottom:none;}
    .w-name{width:140px;flex-shrink:0;font-weight:600;}
    .w-pos{width:160px;flex-shrink:0;color:var(--muted);font-size:11px;}
    .w-bar-bg{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
    .w-bar-fill{height:100%;border-radius:2px;}
    .w-amt{width:52px;text-align:right;font-weight:700;flex-shrink:0;}
    .w-var{width:64px;text-align:right;flex-shrink:0;}
    .var-pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
    .var-over{background:#fce8e8;color:var(--brick);}
    .var-under{background:#e8f5ec;color:#2a7a47;}
    .var-even{background:var(--surface2);color:var(--muted);}

    /* OT */
    .ot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:24px;}
    .ot-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
    .ot-name{font-size:13px;font-weight:600;}
    .ot-desc{font-size:11px;color:var(--muted);margin-top:2px;}
    .ot-hrs{font-size:15px;font-weight:800;color:var(--rust);flex-shrink:0;margin-left:12px;}

    /* MODAL */
    .modal-bg{position:fixed;inset:0;background:rgba(27,22,18,.65);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
    .modal{background:var(--surface);border-radius:8px;width:100%;max-width:540px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}
    .modal-title{font-size:15px;font-weight:800;color:var(--text);display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
    .close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;}
    .close-btn:hover{color:var(--text);}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .form-group{display:flex;flex-direction:column;gap:5px;}
    .form-group.full{grid-column:span 2;}
    .form-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
    .form-group input,.form-group select{font-family:var(--font);font-size:13px;border:1px solid var(--border);border-radius:4px;padding:8px 10px;color:var(--text);background:var(--surface);}
    .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--orange);}
    .modal-body{flex:1;overflow-y:auto;padding:28px;}
    .modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface);border-radius:0 0 8px 8px;flex-shrink:0;}

    /* POINTS */
    .pt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

    /* TOAST */
    .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:6px;font-size:13px;font-weight:700;z-index:300;font-family:var(--font);opacity:0;transition:opacity .2s;pointer-events:none;}
    .toast.show{opacity:1;}
    .toast.success{background:#2a7a47;color:#fff;}
    .toast.error{background:var(--brick);color:#fff;}
    .loading-state{padding:80px;text-align:center;color:var(--muted);font-size:13px;}

    /* DOCUMENTS */
    .doc-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;}
    .doc-tab{padding:8px 16px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;font-family:var(--font);}
    .doc-tab.active{color:var(--orange);border-bottom-color:var(--orange);}
    .doc-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;}
    .doc-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:6px;border:1px solid var(--border);}
    .doc-icon{width:32px;height:32px;border-radius:4px;background:var(--rust);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:white;font-weight:700;}
    .doc-name{font-size:12.5px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .doc-meta{font-size:11px;color:var(--muted);}
    .doc-actions{display:flex;gap:6px;flex-shrink:0;}
    .upload-zone{border:2px dashed var(--border);border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:border-color 0.15s;}
    .upload-zone:hover{border-color:var(--orange);}
    .upload-zone.dragover{border-color:var(--orange);background:rgba(238,116,37,0.05);}
    .upload-zone input[type=file]{display:none;}
    .upload-zone-label{font-size:13px;color:var(--muted);}
    .upload-zone-label span{color:var(--orange);font-weight:600;}
    .upload-form{display:flex;flex-direction:column;gap:12px;margin-top:14px;}
    .progress-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:8px;}
    .progress-fill{height:100%;background:var(--orange);border-radius:2px;transition:width 0.3s;}
  </style>
</head>

const user = window.__SFP_USER__ || {};
document.getElementById('userName').textContent = user.name || user.email || '';
if (user.picture) document.getElementById('userAvatar').src = user.picture;

let state = {
  tab:'employees', employees:[], economics:[],
  ot:{post:[],weekend:[],pre:[]}, points:[],
  filterName:'', filterDept:'all', filterStatus:'Active',
  editing:null, dirty:false, loading:true, otEditing:false, ptEditing:false,
  sortCol:'name', sortDir:'asc',
  burden:0.44, mhr:15.0,
  emailSettings:{managers:[], autoSend:false, otBudgetPercent:10},
  otEmailSending:false,
  backfill:null, backfillOnlyIncomplete:false,
  dailyWorkDate:'', dailyPreview:null, dailyPreviewFile:null, dailyDupAck:false, dailyLastImport:null,
  dailyDays:[], dailyFrom:'', dailyTo:'', dailyLoading:false, dailyLoaded:false,
  dailyBusy:false, dailyPending:null, restampFrom:'', restampTo:'', restampResult:null,
  otReport:null, otReportWeeks:[], otReportWeek:'', otReportLoading:false, otReportError:'',
  otReportTruncated:false, otReportWindow:null,
  otSortCol:'netOtDollars', otSortDir:'desc', otDayDept:'all', otOpenDays:{}
};

function fmt$(n){return n==null?'—':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtWage(w){return !w||w==='Salary'?'Salary':('$'+parseFloat(String(w).replace(/[$,]/g,'')).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}));}

// ============================================================
// PAYROLL SHARED HELPERS
// ============================================================

// The payroll reporting taxonomy. Deliberately separate from employees.dept
// (Sawmill / Filing Room / Log Yard / SG&A): nothing maps one onto the other,
// department is set explicitly per employee.
const PAYROLL_DEPARTMENTS=['Maintenance','Saw Filing','Shipping','Production'];
const DAY_NAMES=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTH_ABBR=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// Dates come back as plain YYYY-MM-DD. new Date('2026-08-17') is parsed as UTC
// and renders as the previous day in Pacific time, so split the string instead
// of letting Date do it.
function dateParts(s){const p=String(s||'').slice(0,10).split('-');return (p.length===3&&p[0])?[+p[0],+p[1],+p[2]]:null;}
function fmtDate(s){const p=dateParts(s);return p?MONTH_ABBR[p[1]-1]+' '+p[2]+', '+p[0]:'—';}
function fmtDateShort(s){const p=dateParts(s);return p?MONTH_ABBR[p[1]-1]+' '+p[2]:'—';}
function isoDow(s){const p=dateParts(s);if(!p)return 0;const d=new Date(p[0],p[1]-1,p[2]).getDay();return d===0?7:d;}
function dayNameOf(s){const p=dateParts(s);return p?DAY_NAMES[new Date(p[0],p[1]-1,p[2]).getDay()]:'';}
function isScheduledDate(s){const d=isoDow(s);return d>=1&&d<=4;}
function isoToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function isoShift(s,days){const p=dateParts(s);if(!p)return s;const d=new Date(p[0],p[1]-1,p[2]+days);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function fmtStamp(ts){if(!ts)return '—';const d=new Date(ts);return isNaN(d.getTime())?String(ts):d.toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});}
function fmtHrs(n){return (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtCount(n){return n==null?'—':Number(n).toLocaleString('en-US');}

// Whole calendar days between a stored timestamp and today. Both ends go through
// dateParts for the same reason everything else here does: new Date('2026-08-11')
// is UTC midnight, which is the 10th in Pacific, and an item that arrived this
// morning would read as a day stale.
function daysSince(ts){const a=dateParts(ts),b=dateParts(isoToday());if(!a||!b)return null;
  return Math.round((Date.UTC(b[0],b[1]-1,b[2])-Date.UTC(a[0],a[1]-1,a[2]))/86400000);}
function waitedLabel(ts){const d=daysSince(ts);
  return d==null?'unresolved — arrival time unknown':d<=0?'unresolved, arrived today':d===1?'unresolved for 1 day':'unresolved for '+d+' days';}
function waitedColor(ts){const d=daysSince(ts);return (d==null||d>=3)?'var(--brick)':d>=1?'#9a600a':'var(--muted)';}

// Vendor message ids land inside a single-quoted JS string inside a double-quoted
// HTML attribute, so they have to survive both layers — JS first, then HTML.
function jsStr(v){return esc(String(v==null?'':v).replace(/\\/g,'\\\\').replace(/'/g,"\\'"));}
function fmtPct(f){return f==null?'—':(Number(f)*100).toFixed(1)+'%';}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);}

// Fri/Sat/Sun work is normal here — maintenance crews run weekends — so this
// labels the day, it never warns about it.
function schedBadge(isSched){return isSched?'<span class="badge active">Scheduled Mon–Thu</span>':'<span class="badge en">Non-scheduled Fri–Sun</span>';}

// Every /api/payroll-import call goes through here so a failed request raises
// instead of leaving a panel spinning on nothing.
async function payrollPost(body){
  const res=await fetch('/api/payroll-import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(res.status===401){location.href='/';throw new Error('Session expired');}
  let json=null;
  try{json=await res.json();}catch(e){json=null;}
  if(!res.ok||!json||json.ok===false) throw new Error((json&&json.error)||('Request failed ('+res.status+')'));
  return json;
}

function goToTab(tab){
  const btn=document.querySelector('.sfp-tab[data-tab="'+tab+'"]');
  switchTab(tab,btn);
}

async function loadData(){
  try{
    const [empRes, econRes, otRes, ptRes] = await Promise.all([
      fetch('/api/data?table=employees'),
      fetch('/api/data?table=economics'),
      fetch('/api/data?table=overtime'),
      fetch('/api/data?table=points')
    ]);
    if(empRes.status===401){location.href='/';return;}

    const [empJson, econJson, otJson, ptJson] = await Promise.all([
      empRes.json(), econRes.json(), otRes.json(), ptRes.json()
    ]);

    // Employees
    state.employees = (empJson.data||[]).map(r=>({
      id:r.id, name:r.name||'', wage:r.wage||'', dept:r.dept||'',
      status:r.status||'Active', days:r.days||'', clockIn:r.clock_in||'',
      clockOut:r.clock_out||'', break1:r.break_1||'', break2:r.break_2||'',
      birthday:r.birthday||'', phone:r.phone||'', language:r.language||'',
      email:r.email||'', ...normalizeSms(r), driveFolderId:r.drive_folder_id||'',
      empNum:r.employee_number||'', department:r.department||''
    }));

    // Economics
    state.economics = (econJson.data||[]).map(r=>({
      id:r.id, num:r.num, section:r.section||'', position:r.position||'',
      name:r.name||'', max:parseFloat(r.max_wage)||0
    }));

    // OT
    state.ot = {pre:[], post:[], weekend:[]};
    (otJson.data||[]).forEach(r=>{
      const rec={id:r.id, name:r.name, hours:parseFloat(r.hours)||0, desc:r.description||''};
      if(r.ot_type==='Pre-Shift') state.ot.pre.push(rec);
      else if(r.ot_type==='Post-Shift') state.ot.post.push(rec);
      else state.ot.weekend.push(rec);
    });

    // Points
    state.points = (ptJson.data||[]).map(r=>({
      id:r.id, name:r.name, points:r.points||0, lastDate:r.last_point_date||'',
      levelElig:r.level_up_eligible||'', disciplinary:r.disciplinary||false,
      discDate:r.disc_date||''
    }));

    state.loading=false;
  }catch(e){console.error('loadData error:',e);state.loading=false;}
  render();
}

function switchTab(tab,el){
  state.tab=tab;
  document.querySelectorAll('.sfp-tab').forEach(t=>t.classList.remove('active'));
  const pill=el||document.querySelector('.sfp-tab[data-tab="'+tab+'"]');
  if(pill) pill.classList.add('active');
  render();
  // The payroll tabs read their own endpoints, so they load on first open
  // rather than on every page load.
  if(tab==='otreport'&&!state.otReport&&!state.otReportLoading) loadOTReport(state.otReportWeek);
  if(tab==='dailyhours'&&!state.dailyLoaded&&!state.dailyLoading) loadDailyDays();
}

function render(){
  const el=document.getElementById('tabContent');
  if(state.loading){el.innerHTML='<div class="loading-state">Loading…</div>';return;}
  if(state.tab==='employees')el.innerHTML=renderEmployees();
  else if(state.tab==='economics')el.innerHTML=renderEcon();
  else if(state.tab==='overtime')el.innerHTML=renderOT();
  else if(state.tab==='points')el.innerHTML=renderPoints();
  else if(state.tab==='dailyhours')el.innerHTML=renderDailyHours();
  else if(state.tab==='otreport')el.innerHTML=renderOTReport();
  else if(state.tab==='settings')el.innerHTML=renderSettings();
}

function getFiltered(){
  let list = state.employees.filter(e=>
    (state.filterStatus==='all'||e.status===state.filterStatus)&&
    (state.filterDept==='all'||e.dept===state.filterDept)&&
    (!state.filterName||e.name.toLowerCase().includes(state.filterName.toLowerCase()))
  );
  const col = state.sortCol || 'name';
  const dir = state.sortDir === 'desc' ? -1 : 1;
  return [...list].sort((a,b)=>{
    if(col==='wage'){
      const av=parseFloat(String(a.wage||'0').replace(/[$,]/g,''))||0;
      const bv=parseFloat(String(b.wage||'0').replace(/[$,]/g,''))||0;
      return (av-bv)*dir;
    }
    const av=String(a[col]||'').toLowerCase();
    const bv=String(b[col]||'').toLowerCase();
    return av<bv?-dir:av>bv?dir:0;
  });
}

function renderEmployees(){
  const active=state.employees.filter(e=>e.status==='Active');
  const en=active.filter(e=>e.language==='English').length;
  const es=active.filter(e=>e.language==='Spanish').length;
  const allDepts=[...new Set(state.employees.map(e=>e.dept))].filter(Boolean).sort();

  return `
    <div class="stat-row">
      <div class="stat-card"><div class="stat-label">Active headcount</div><div class="stat-value">${active.length}</div><div class="stat-sub">of ${state.employees.length} total</div></div>
      <div class="stat-card"><div class="stat-label">English speakers</div><div class="stat-value">${en}</div><div class="stat-sub">${es} Spanish</div></div>
      <div class="stat-card"><div class="stat-label">Departments</div><div class="stat-value">${allDepts.length}</div></div>
      <div class="stat-card"><div class="stat-label">Inactive</div><div class="stat-value">${state.employees.length-active.length}</div><div class="stat-sub">on roster</div></div>
    </div>
    <div class="section-head">
      <span>Employee roster</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="openBackfill()">Back-fill payroll fields</button>
        <button class="btn btn-outline btn-sm" onclick="copyTextBoltList()" id="copyTBBtn">📋 Copy TextBolt list</button>
        <button class="btn btn-primary btn-sm" onclick="openAdd()">+ Add employee</button>
      </div>
    </div>
    <div class="search-row">
      <input type="text" id="empSearch" placeholder="Search by name…" value="${state.filterName}" oninput="state.filterName=this.value;renderEmployeeList()">
      <select onchange="state.filterDept=this.value;renderEmployeeList()">
        <option value="all" ${state.filterDept==='all'?'selected':''}>All departments</option>
        ${allDepts.map(d=>`<option value="${d}" ${state.filterDept===d?'selected':''}>${d}</option>`).join('')}
      </select>
      <select onchange="state.filterStatus=this.value;renderEmployeeList()">
        <option value="Active" ${state.filterStatus==='Active'?'selected':''}>Active only</option>
        <option value="Inactive" ${state.filterStatus==='Inactive'?'selected':''}>Inactive</option>
        <option value="all" ${state.filterStatus==='all'?'selected':''}>All</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${['name','wage','dept','department','status','language','days','phone'].map(col=>{
            const labels={name:'Name',wage:'Wage/hr',dept:'Department',department:'Payroll dept',status:'Status',language:'Lang',days:'Schedule',phone:'Phone'};
            const active=state.sortCol===col;
            const arrow=active?(state.sortDir==='asc'?'↑':'↓'):'';
            return '<th style="cursor:pointer;user-select:none;white-space:nowrap" onclick="sortEmployees(\''+col+'\')">'+labels[col]+(arrow?'<span style=\"color:var(--orange);margin-left:3px\">'+arrow+'</span>':'')+'</th>';
          }).join('')}

        </tr></thead>
        <tbody>
          ${filtered.length?filtered.map(e=>`
            <tr>
              <td style="font-weight:600">${e.name}</td>
              <td>${fmtWage(e.wage)}</td>
              <td>${e.dept||'—'}</td>
              <td${e.department?'':' style="color:var(--muted)"'}>${e.department||'—'}</td>
              <td><span class="badge ${e.status==='Active'?'active':'inactive'}">${e.status||'—'}</span></td>
              <td><span class="badge ${e.language==='Spanish'?'es':'en'}">${e.language==='Spanish'?'ES':'EN'}</span></td>
              <td style="color:var(--muted);font-size:11px">${e.days||'—'}</td>
              <td style="color:var(--muted);font-size:11px">${e.phone||'—'}</td>
              <td>${smsCell(e)}</td>
              <td><button class="btn btn-outline btn-sm" onclick="openEdit(${state.employees.indexOf(e)})">Edit</button></td>
            </tr>`).join(''):
            '<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:32px">No employees match</td></tr>'}
        </tbody>
      </table>
    </div>
    ${state.editing!==null?renderModal():''}
    ${state.backfill?renderBackfill():''}
  `;
}

function formatWageInput(input) {
  const val = input.value.trim();
  if (!val || val.toLowerCase() === 'salary') {
    input.value = 'Salary';
    state.editing.wage = 'Salary';
    return;
  }
  const num = parseFloat(val.replace(/[$,]/g, ''));
  if (!isNaN(num)) {
    const formatted = '$' + num.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
    input.value = formatted;
    state.editing.wage = num;
  }
}

function sortEmployees(col) {
  if (state.sortCol === col) {
    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sortCol = col;
    state.sortDir = 'asc';
  }
  render();
}

function renderEmployeeList() {
  const filtered = getFiltered();

  // Update stat cards
  const active = state.employees.filter(e => e.status === 'Active');
  const spanish = active.filter(e => e.language === 'Spanish').length;
  const depts = [...new Set(active.map(e => e.dept).filter(Boolean))].length;
  const inactive = state.employees.filter(e => e.status === 'Inactive').length;

  const statEls = document.querySelectorAll('.stat-value');
  if (statEls.length >= 4) {
    statEls[0].textContent = active.length;
    statEls[1].textContent = active.length - spanish;
    statEls[2].textContent = depts;
    statEls[3].textContent = inactive;
  }

  // Update table body only
  const tbody = document.querySelector('.table-wrap tbody');
  if (!tbody) return;

  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;color:var(--muted);padding:32px">No employees match</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(e => {
    const idx = state.employees.indexOf(e);
    return `<tr>
      <td style="font-weight:600">${e.name}</td>
      <td>${e.wage||'—'}</td>
      <td style="color:var(--muted)">${e.dept||'—'}</td>
      <td style="color:${e.department?'var(--text)':'var(--muted)'}">${e.department||'—'}</td>
      <td><span class="badge ${e.status==='Active'?'active':'inactive'}">${e.status}</span></td>
      <td><span class="badge ${e.language==='Spanish'?'es':'en'}">${e.language==='Spanish'?'ES':'EN'}</span></td>
      <td style="color:var(--muted);font-size:11px">${e.days||'—'}</td>
      <td style="color:var(--muted);font-size:11px">${e.phone||'—'}</td>
      <td>${smsCell(e)}</td>
      <td><button class="btn btn-outline btn-sm" onclick="openEdit(${idx})">Edit</button></td>
    </tr>`;
  }).join('');
}

// Opting out sets a flag and never touches the phone number, so opting back in
// resumes texting with nothing to re-enter. The old version overwrote the
// text_bolt column with 'STOP', destroying the stored address.
function toggleSmsOptOut(checkbox) {
  state.editing.smsOptedOut = checkbox.checked;
  refreshSmsStatus();
}

function refreshSmsStatus() {
  const status = document.getElementById('smsOptOutStatus');
  if (!status) return;
  const e = state.editing;
  status.textContent = smsStatusText(e);
  const bad = !normalizePhone(e.phone);
  status.style.color = e.smsOptedOut ? '#c0392b' : (bad ? '#b8860b' : 'var(--muted)');
}

// The opt-out lives in sms_opted_out. A leftover 'STOP' in the deprecated
// text_bolt column still counts as opted out until that column is dropped.
function normalizeSms(r) {
  return {
    smsOptedOut: r.sms_opted_out === true ||
                 String(r.text_bolt || '').trim().toUpperCase() === 'STOP'
  };
}

// Phone is the single source of truth for SMS. Free-text column, so strip to
// digits; a leading US country code is tolerated. Returns 10 digits or ''.
function normalizePhone(v) {
  const digits = String(v || '').replace(/\D/g, '');
  const local = (digits.length === 11 && digits.startsWith('1')) ? digits.slice(1) : digits;
  return local.length === 10 ? local : '';
}

// The TextBolt address is derived, never stored.
function textBoltAddress(phone) {
  const local = normalizePhone(phone);
  return local ? '+1' + local + '@sendemailtotext.com' : '';
}

function fmtPhone(phone) {
  const d = normalizePhone(phone);
  return d ? '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6) : '';
}

function smsStatusText(e) {
  const num = fmtPhone(e.phone);
  if (!num) return String(e.phone || '').trim()
    ? 'Phone number is not a valid 10-digit number \u2014 cannot text'
    : 'No phone number on file \u2014 cannot text';
  return e.smsOptedOut ? 'Opted out \u2014 not receiving texts' : 'Receiving texts at ' + num;
}

// Employees-table SMS cell. The phone number lives in its own column and stays
// visible and editable either way; this cell reports only SMS reachability.
function smsCell(e) {
  if (e.smsOptedOut) {
    return '<div style="font-size:10px;color:#c0392b;font-weight:700">OPTED OUT</div>';
  }
  if (!normalizePhone(e.phone)) {
    return String(e.phone || '').trim()
      ? '<div style="font-size:10px;color:#b8860b;font-weight:700" title="Phone does not normalize to 10 digits">BAD PHONE</div>'
      : '<span style="color:var(--muted)">\u2014</span>';
  }
  return '<div style="font-size:10px;color:#2a7a47;font-weight:700">SMS OK</div>';
}

function openEdit(idx){
  state.editing={...state.employees[idx],_idx:idx,_isNew:false};
  render();
  // Load Drive folder link after render
  setTimeout(()=>loadDriveLink(state.employees[idx].name), 50);

function openAdd(){state.editing={name:'',wage:'',dept:'Sawmill',empNum:'',department:'',status:'Active',days:'MON-THU',clockIn:'4:55 AM',clockOut:'3:35 PM',break1:'7:00 AM',break2:'12:45 PM',birthday:'',phone:'',language:'English',email:'',smsOptedOut:false,_isNew:true};render();}
function closeModal(){state.editing=null;render();}

function setSyncStatus(s){
  const el=document.getElementById('syncStatus');
  if(!el) return;
  if(s==='saving'){el.textContent='● Saving…';el.className='sfp-sync-status saving';}
  else if(s==='error'){el.textContent='● Sync error';el.className='sfp-sync-status error';}
  else{el.textContent='● Synced';el.className='sfp-sync-status idle';}
}

// Columns that only exist once their migration has been run. PostgREST rejects
// the whole row when one of them is missing (surfacing as a 500 from /api/data),
// so the write is retried once without them rather than losing the user's edit.
const OPTIONAL_EMPLOYEE_COLUMNS = {
  sms_opted_out:'the SMS opt-out needs SCHEMA_SMS_OPTOUT.sql to persist',
  employee_number:'the payroll employee # needs SCHEMA_DAILY_HOURS.sql to persist',
  department:'the payroll department needs SCHEMA_DAILY_HOURS.sql to persist'
};

async function writeEmployeeRow(url, method, row){
  const send = body => fetch(url, {
    method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
  });

  let res = await send(row);
  if(res.ok) return res;

  const detail = await res.clone().text().catch(()=>'');
  const missing = Object.keys(OPTIONAL_EMPLOYEE_COLUMNS).filter(c => (c in row) && detail.includes(c));
  if(!missing.length) return res;

  console.warn('employees is missing ' + missing.join(', ') + ' — run the schema migration. Saving without those fields for now.');
  // Say so out loud: everything else saves, but these fields will not stick
  // until the migration runs, and silently dropping them is what caused the
  // last round of lost data.
  missing.forEach(c => {
    if(writeEmployeeRow._warned[c]) return;
    writeEmployeeRow._warned[c] = true;
    setTimeout(()=>toast('Saved — but ' + OPTIONAL_EMPLOYEE_COLUMNS[c], 'error'), 400);
  });
  const fallback = {...row};
  missing.forEach(c => delete fallback[c]);
  return send(fallback);
}
writeEmployeeRow._warned = {};

async function saveEdit(){
  const e={...state.editing};const idx=e._idx;const isNew=e._isNew;
  delete e._idx;delete e._isNew;

  setSyncStatus('saving');
  try{
    // Normalize wage: convert formatted string to number if needed
    let wage = e.wage;
    if(typeof wage === 'string'){
      if(wage.toLowerCase() === 'salary'){
        wage = 'Salary';
      } else {
        wage = parseFloat(wage.replace(/[$,]/g,'')) || wage;
      }
    }
    e.wage = wage; // Update the editing object with normalized wage

    const row={
      name:e.name, wage:wage, dept:e.dept, status:e.status,
      days:e.days, clock_in:e.clockIn, clock_out:e.clockOut,
      break_1:e.break1||'7:00 AM', break_2:e.break2||'12:45 PM',
      birthday:e.birthday, phone:e.phone, language:e.language,
      email:e.email, sms_opted_out:e.smsOptedOut===true,
      drive_folder_id:e.driveFolderId||null,
      employee_number:normEmpNum(e.empNum)||null, department:e.department||null
    };

    if(e.id){
      const res=await writeEmployeeRow('/api/data?table=employees&id='+e.id,'PATCH',row);
      if(!res.ok) throw new Error(`Save failed with status ${res.status}`);
    } else {
      const res=await writeEmployeeRow('/api/data?table=employees','POST',row);
      if(!res.ok) throw new Error(`Save failed with status ${res.status}`);
      const d=await res.json();
      if(d.data?.[0]?.id) e.id=d.data[0].id;
    }

    if(isNew)state.employees.push(e);else state.employees[idx]=e;
    state.editing=null;
    setSyncStatus('idle');
    toast('Saved','success');

    // Auto-create Drive folder for new employees in the background
    if(isNew && e.name){
      fetch('/api/documents?employee='+encodeURIComponent(e.name))
        .catch(()=>{});
    }
    render();
  }catch(err){
    setSyncStatus('error');
    toast('Save failed: '+err.message,'error');
  }
}

function calcDollarPerM(wage){
  return wage * (1 + state.burden) / state.mhr;
}

function getEmpWage(name){
  const emp = state.employees.find(e=>e.name===name);
  if(!emp) return 0;
  const w = String(emp.wage||'').replace(/[$,]/g,'');
  return parseFloat(w)||0;
}

function renderEcon(){
  const burden = state.burden;
  const mhr = state.mhr;

  // Active non-SGA employees
  const eligible = state.employees.filter(e=>e.status==='Active' && e.dept!=='SG&A');

  // Find duplicates
  const nameCount = {};
  state.economics.forEach(p=>{ if(p.name) nameCount[p.name]=(nameCount[p.name]||0)+1; });
  const dupes = new Set(Object.keys(nameCount).filter(n=>nameCount[n]>1));

  // Unassigned = eligible employees not in any position
  const assignedNames = new Set(state.economics.map(p=>p.name).filter(Boolean));
  const unassigned = eligible.filter(e=>!assignedNames.has(e.name));

  const secs = [...new Set(state.economics.map(e=>e.section))];
  const totalWage = state.economics.reduce((s,p)=>s+(p.name?getEmpWage(p.name):0),0);
  const totalDpm = state.economics.reduce((s,p)=>s+(p.name?calcDollarPerM(getEmpWage(p.name)):0),0);

  // Build dropdown options — all eligible employees
  const empOptions = eligible.map(e=>`<option value="${e.name}">${e.name}</option>`).join('');

  // Build position rows
  const posRows = secs.map(sec=>{
    const positions = state.economics.filter(p=>p.section===sec);
    const hdr = `<div class="dept-header">${sec}</div>`;
    const rows = positions.map(p=>{
      const econIdx = state.economics.indexOf(p);
      const wage = p.name ? getEmpWage(p.name) : 0;
      const dpm = wage ? '$'+calcDollarPerM(wage).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—';
      const variance = (p.name && p.max) ? wage - p.max : null;
      const isOver = variance !== null && variance > 0;
      const isUnder = variance !== null && variance < 0;
      const varStr = variance === null ? '—' : (variance > 0 ? '+$'+variance.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '-$'+Math.abs(variance).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}));
      const varCls = isOver ? 'var-over' : isUnder ? 'var-under' : 'var-even';
      const isDupe = p.name && dupes.has(p.name);
      const rowAlert = isDupe ? ' style="border-color:#e67e22;background:#fffbf5"' : '';

      return `<div class="pos-row"${rowAlert}>
        <div class="pos-num">${p.num}</div>
        <div class="pos-title">${p.position}</div>
        <div>
          <select class="pos-select${isDupe?' dupe-select':''}" onchange="econAssign(${econIdx},this.value)">
            <option value="">— unassigned —</option>
            ${eligible.map(e=>`<option value="${e.name}" ${p.name===e.name?'selected':''}>${e.name}</option>`).join('')}
          </select>
          ${isDupe ? '<span style="color:#e67e22;font-size:10px;font-weight:700;margin-left:6px">⚠ assigned twice</span>' : ''}
        </div>
        <div class="pos-dpm">${wage ? '$'+wage.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'}</div>
        <div class="pos-dpm">${dpm}</div>
        <div class="pos-max">${p.max ? '$'+Number(p.max).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) : '—'}</div>
        <div class="pos-var ${varCls}">${varStr}</div>
      </div>`;
    }).join('');
    return hdr + rows;
  }).join('');

  return `<style>
    .econ-layout{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:start}
    .unassigned-panel{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;position:sticky;top:0}
    .unassigned-panel h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--rust);margin:0 0 8px}
    .unemp{font-size:12px;font-weight:600;padding:4px 0;border-bottom:1px solid var(--border);color:var(--text)}
    .unemp:last-child{border:none}
    .dept-header{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:white;background:var(--rust);padding:5px 12px;border-radius:6px;margin-top:10px}
    .pos-row{display:grid;grid-template-columns:28px 130px 1fr 65px 65px 65px 75px;gap:8px;align-items:center;padding:6px 8px;background:var(--surface);border:1px solid var(--border);border-radius:6px;font-size:11px;margin-top:3px}
    .pos-select{font-family:var(--font);font-size:11px;border:1px solid var(--border);border-radius:4px;padding:3px 6px;width:100%;background:white}
    .pos-select.dupe-select{border-color:#e67e22}
    .pos-num{color:var(--muted);font-size:10px;font-weight:700}
    .pos-title{font-weight:600;font-size:11px}
    .pos-dpm,.pos-max{font-size:11px}
    .pos-var{font-size:11px;font-weight:600}
    .var-over{color:#e74c3c}
    .var-under{color:#2a7a47}
    .var-even{color:var(--muted)}
    .econ-controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:10px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:8px}
    .econ-ctrl{display:flex;align-items:center;gap:6px;font-size:12px}
    .econ-ctrl label{color:var(--muted);font-weight:600}
    .econ-ctrl input{width:65px;font-family:var(--font);font-size:12px;border:1px solid var(--border);border-radius:4px;padding:3px 7px}
    .col-hdr{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.3px}
  </style>

  <div class="stat-row">
    <div class="stat-card"><div class="stat-label">Positions</div><div class="stat-value">${state.economics.length}</div>
      <div class="stat-sub">${unassigned.length>0?'<span style="color:#e67e22">⚠ '+unassigned.length+' unassigned</span>':'✓ All filled'}</div></div>
    <div class="stat-card"><div class="stat-label">Wage pool</div><div class="stat-value">$${totalWage.toFixed(0)}<span style="font-size:13px">/hr</span></div></div>
    <div class="stat-card"><div class="stat-label">Burdened cost</div><div class="stat-value">$${totalDpm.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}<span style="font-size:13px">/m</span></div></div>
    <div class="stat-card"><div class="stat-label">Duplicates</div><div class="stat-value" style="color:${dupes.size?'#e67e22':'#2a7a47'}">${dupes.size}</div>
      <div class="stat-sub">${dupes.size?[...dupes].join(', '):'none'}</div></div>
  </div>

  <div class="econ-controls">
    <div class="econ-ctrl"><label>Burden %</label><input type="number" value="${(burden*100).toFixed(0)}" min="0" max="100" step="1" onchange="state.burden=+this.value/100;render()"> %</div>
    <div class="econ-ctrl"><label>M/Hr</label><input type="number" value="${mhr}" min="1" step="0.5" onchange="state.mhr=+this.value;render()"></div>
    <div style="margin-left:auto"><button class="btn btn-primary btn-sm" onclick="saveEconomics()">Save staffing plan</button></div>
  </div>

  <div class="econ-layout">
    <div class="unassigned-panel">
      <h4>Unassigned (${unassigned.length})</h4>
      ${unassigned.length
        ? unassigned.map(e=>`<div class="unemp">${e.name}<span style="color:var(--muted);font-size:10px;float:right">${getEmpWage(e.name)?'$'+getEmpWage(e.name).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):''}</span></div>`).join('')
        : '<div style="font-size:11px;color:#2a7a47;padding:4px">&#x2713; All employees assigned</div>'}
    </div>
    <div>
      <div style="display:grid;grid-template-columns:28px 130px 1fr 65px 65px 65px 75px;gap:8px;padding:3px 8px;margin-bottom:4px">
        <div class="col-hdr">#</div>
        <div class="col-hdr">Position</div>
        <div class="col-hdr">Employee</div>
        <div class="col-hdr">$/hr</div>
        <div class="col-hdr">$/m</div>
        <div class="col-hdr">Max $/hr</div>
        <div class="col-hdr">Variance</div>
      </div>
      ${posRows}
    </div>
  </div>`;
}

function econAssign(posIdx, name) {
  state.economics[posIdx].name = name;
  render();
}

function econUnassign(posIdx) {
  state.economics[posIdx].name = '';
  render();
}

async function saveEconomics() {
  try {
    for(const p of state.economics){
      if(p.id){
        await fetch('/api/data?table=economics&id='+p.id,{
          method:'PATCH', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({name:p.name||''})
        });
      }
    }
    toast('Staffing plan saved', 'success');
  } catch(e) { toast('Save failed: '+e.message, 'error'); }
}




function renderOT(){

        <button class="btn btn-primary btn-sm" onclick="state.otEditing=true;render()">✎ Edit OT</button>

async function loadOTReport(week){
  state.otReportLoading=true; state.otReportError=''; render();
  try{
    const res=await fetch('/api/payroll-report'+(week?('?week='+encodeURIComponent(week)):''));
    if(res.status===401){location.href='/';return;}
    let json=null;
    try{json=await res.json();}catch(e){json=null;}
    if(!res.ok||!json||json.ok===false) throw new Error((json&&json.error)||('Request failed ('+res.status+')'));
    state.otReport=json.report||null;
    state.otReportWeeks=json.availableWeeks||[];
    state.otReportWeek=(json.report&&json.report.weekStart)||week||'';
    // The endpoint scans a bounded window and says so rather than returning a
    // short answer that looks whole; the page has to repeat that out loud.
    state.otReportTruncated=json.truncated===true;
    state.otReportWindow=json.dataWindow||null;
  }catch(err){
    state.otReport=null; state.otReportError=err.message;
    state.otReportTruncated=false; state.otReportWindow=null;
    toast('Could not load the OT report: '+err.message,'error');
  }
  state.otReportLoading=false; render();
}

// The old email hardcoded 10%. It drives an over/under-budget flag managers act on,
// so it lives in emailSettings and is editable on the Settings tab.
const OT_BUDGET_DEFAULT=10;
function otBudgetPct(){const v=Number(state.emailSettings.otBudgetPercent);return isFinite(v)&&v>=0?v:OT_BUDGET_DEFAULT;}

function otWeekRangeLabel(a,b){
  const pa=dateParts(a),pb=dateParts(b);
  if(!pa||!pb) return '—';
  const lbl=(iso,p)=>dayNameOf(iso).slice(0,3)+' '+MONTH_ABBR[p[1]-1]+' '+p[2];
  return lbl(a,pa)+' – '+lbl(b,pb)+', '+pb[0];
}

// Every dollar figure here comes straight off the report, which takes OT dollars as the
// residual of the payroll system's own blended earnings — a flat 1.5x undercounts the
// 4x10 double-time hours by ~3%, so nothing is recomputed from hours and a rate.
function otEmailPayload(){
  const r=state.otReport; if(!r) return null;
  const s=r.summary||{};
  const payroll=Number(s.totalHourlyPayroll)||0;
  const pct=d=>payroll>0?((Number(d)||0)/payroll*100).toFixed(1):'0.0';
  const exceeded=(r.employees||[]).filter(e=>(Number(e.netOtHours)||0)>0)
    .sort((a,b)=>(Number(b.netOtHours)||0)-(Number(a.netOtHours)||0));
  const shown=exceeded.slice(0,15);
  const regular=(Number(s.totalHours)||0)-(Number(s.allOtHours)||0);
  return {
    dateRange:otWeekRangeLabel(r.weekStart,r.weekEnd),
    totalPayroll:payroll.toFixed(2),
    totalOTHours:(Number(s.allOtHours)||0).toFixed(2),
    totalRegularHours:regular.toFixed(2),
    totalPreApprovedHours:(Number(s.preApprovedHours)||0).toFixed(2),
    netOTHours:(Number(s.netOtHours)||0).toFixed(2),
    totalOTPercent:pct(s.allOtDollars),
    preApprovedOTPercent:pct(s.preApprovedDollars),
    netOTPercent:pct(s.netOtDollars),
    otBudgetPercent:otBudgetPct().toFixed(1),
    employeeCount:Number(s.headcount)||0,
    exceededEmployees:shown.map(e=>({name:e.name||('#'+e.employeeNumber),unapprovedHours:(Number(e.netOtHours)||0).toFixed(2)})),
    exceededOmitted:exceeded.length-shown.length,
    reportLink:'https://seq-staffing.netlify.app/app.html',
    uploadTime:new Date().toLocaleString('en-US',{timeZone:'America/Los_Angeles',month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})+' PT'
  };
}

async function sendOTReportEmail(opts){
  const auto=!!(opts&&opts.auto);
  const managers=state.emailSettings.managers||[];
  if(!managers.length){ if(!auto) toast('No managers configured in Settings','error'); return false; }
  const data=otEmailPayload();
  if(!data){ toast('Load the OT report before emailing it','error'); return false; }
  state.otEmailSending=true; render();
  let ok=false;
  try{
    const res=await fetch('/api/send-ot-email',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({to:managers,subject:'OT Report: '+data.dateRange,data})});
    if(res.status===401){state.otEmailSending=false;location.href='/';return false;}
    let json=null; try{json=await res.json();}catch(e){json=null;}
    const sent=(json&&json.sent)||0, failed=(json&&json.failed)||0;
    if(!res.ok&&!sent) throw new Error((json&&json.error)||('Request failed ('+res.status+')'));
    ok=sent>0;
    toast(sent+' manager email'+(sent===1?'':'s')+' sent for '+data.dateRange+(failed?(' — '+failed+' failed'):''),failed?'warning':'success');
  }catch(err){
    toast('Manager email failed: '+err.message,'error');
  }
  state.otEmailSending=false; render();
  return ok;
}

// A truncated report is worse than a failed one: every figure below is real,
// internally consistent and too small. So this says which half came up short and
// by how much, and it is deliberately the loudest thing on the page. It renders
// nothing at all when the response was complete.
function otTruncationBanner(){
  if(!state.otReportTruncated) return '';
  const w=state.otReportWindow||{};
  const bits=[];
  if(w.weekIndexTruncated){
    bits.push(`<li><strong>The list of weeks is short.</strong> The scan over ${w.from&&w.to?(fmtDate(w.from)+' – '+fmtDate(w.to)):'the reporting window'} stopped at ${fmtCount(w.rowsScanned)} row${w.rowsScanned===1?'':'s'}${w.rowsAvailable!=null?(' of '+fmtCount(w.rowsAvailable)+' that exist'):', and the true total could not be counted'}.
      Weeks are missing from the picker above — a week with data may simply not be listed.</li>`);
  }
  if(w.weekDetailTruncated){
    const short=(w.weekRowsExpected!=null&&w.weekRowsFetched!=null)?(w.weekRowsExpected-w.weekRowsFetched):null;
    bits.push(`<li><strong>This week's own rows are short.</strong> ${fmtCount(w.weekRowsFetched)} row${w.weekRowsFetched===1?'':'s'} came back${w.weekRowsExpected!=null?(' of '+fmtCount(w.weekRowsExpected)+' the index says exist'+(short?(' — '+fmtCount(short)+' missing'):'')):''}.
      Every hour, dollar, headcount and percentage below is computed from what came back, so all of them understate the week.</li>`);
  }
  if(!bits.length) bits.push('<li>The report hit its row cap, so the figures below may be incomplete.</li>');
  return `<div class="ot-trunc">
    <div class="ot-trunc-hd">⚠ Incomplete data — the figures below may understate this week</div>
    <ul style="margin:8px 0 0 18px;line-height:1.6">${bits.join('')}</ul>
    <div style="margin-top:8px">Nothing here is wrong on its own; it is simply not all of it. Treat every total on this page as a floor, and do not send it to managers until it comes back complete.</div>
  </div>`;
}

function renderOTReport(){
  const weeks=state.otReportWeeks||[];
  const mgrs=(state.emailSettings.managers||[]).length;
  const emailBlocked=state.otEmailSending?'Sending…':(!mgrs?'Add manager recipients on the Settings tab first':(!state.otReport?'Load a week before emailing it':''));
  const emailBtn=`<button class="btn btn-outline btn-sm" onclick="sendOTReportEmail()" ${emailBlocked?'disabled':''} title="${esc(emailBlocked||('Email this week to '+mgrs+' manager'+(mgrs===1?'':'s')))}">${state.otEmailSending?'Sending…':'Email managers'}</button>`;
  const picker=`
    <div class="ot-bar">
      <label class="ot-bar-label">Work week (Mon–Sun)</label>
      <select onchange="loadOTReport(this.value)">
        ${weeks.length?weeks.map(w=>`<option value="${w.weekStart}" ${w.weekStart===state.otReportWeek?'selected':''}>${fmtDate(w.weekStart)} – ${fmtDate(w.weekEnd)} · ${w.days} days · ${fmtHrs(w.totalHours)} hrs</option>`).join(''):'<option value="">No week has data yet</option>'}
      </select>
      <button class="btn btn-outline btn-sm" onclick="loadOTReport(state.otReportWeek)">Refresh</button>
      ${emailBtn}
      <button class="btn btn-outline btn-sm" onclick="goToTab('dailyhours')">Daily Hours</button>
      <div class="ot-bar-note">Hourly payroll only — salaried staff are excluded at import.</div>
    </div>`;

  const trunc=otTruncationBanner();

  if(state.otReportLoading) return otReportStyle+picker+'<div class="loading-state">Loading the weekly report…</div>';
  if(!state.otReport) return otReportStyle+picker+trunc+`
    <div class="loading-state">
      ${state.otReportError?esc(state.otReportError):'No payroll data for this week yet — import a day on the Daily Hours tab.'}
      <div style="margin-top:14px"><button class="btn btn-primary btn-sm" onclick="loadOTReport(state.otReportWeek)">Try again</button></div>
    </div>`;

  const r=state.otReport;
  const s=r.summary||{};
  const split=r.split||{scheduled:{},nonScheduled:{}};
  const sched=split.scheduled||{}, nons=split.nonScheduled||{};
  const days=r.days||[];
  const depts=r.departments||[];
  const deptNames=depts.map(d=>d.department);
  const dayDept=state.otDayDept||'all';

  // 1. Summary cards
  const cards=`
    <div class="stat-row">
      <div class="stat-card"><div class="stat-label">All OT</div><div class="stat-value">${fmtHrs(s.allOtHours)}<span style="font-size:13px"> hrs</span></div><div class="stat-sub">${fmt$(s.allOtDollars)}</div></div>
      <div class="stat-card"><div class="stat-label">Pre-approved OT</div><div class="stat-value">${fmtHrs(s.preApprovedHours)}<span style="font-size:13px"> hrs</span></div><div class="stat-sub">${fmt$(s.preApprovedDollars)} · standing allowance</div></div>
      <div class="stat-card"><div class="stat-label">Net OT</div><div class="stat-value" style="color:${(s.netOtHours||0)>0?'var(--brick)':'#2a7a47'}">${fmtHrs(s.netOtHours)}<span style="font-size:13px"> hrs</span></div><div class="stat-sub">${fmt$(s.netOtDollars)}</div></div>
      <div class="stat-card"><div class="stat-label">Total hourly payroll</div><div class="stat-value">${fmt$(s.totalHourlyPayroll)}</div><div class="stat-sub">${fmtHrs(s.totalHours)} hrs · ${s.headcount||0} hourly employees</div></div>
      <div class="stat-card"><div class="stat-label">Net OT % of hourly payroll</div><div class="stat-value">${fmtPct(s.netOtPctOfPayroll)}</div><div class="stat-sub">salaried staff are not in the denominator</div></div>
      <div class="stat-card"><div class="stat-label">Weekend labor (Fri–Sun)</div><div class="stat-value">${fmtHrs(s.weekendHours)}<span style="font-size:13px"> hrs</span></div><div class="stat-sub">${fmt$(s.weekendDollars)} · ${s.weekendHeadcount||0} people</div></div>
    </div>`;

  // 2. The overtime table carries no week and no dollars, so the number above is
  // not "OT approved for this week" — it is the standing allowance, applied whole
  // to every week, and its dollars are computed here rather than sourced.
  const standingNote=`<div class="ot-note"><strong>Pre-approved OT is a standing weekly allowance.</strong>
    The Pre-Approved Overtime table has no week dimension and no dollar amounts, so the same allowance is applied to every week,
    and the dollars are derived as hours × rate × 1.5 — they are not sourced from payroll.
    Net OT is OT worked minus that allowance, so it goes negative in a week where less OT was worked than was approved; the negative is shown as-is rather than floored at zero.</div>`;

  // 3. Scheduled vs non-scheduled
  const splitBlock=`
    <div class="section-head"><span>Scheduled vs non-scheduled</span></div>
    <div class="ot-panel">
      <div class="ot-split">
        <div class="ot-split-card">
          <div class="ot-split-hdr">Scheduled · Mon–Thu</div>
          <div class="ot-kv"><span>Hours</span><span>${fmtHrs(sched.hours)}</span></div>
          <div class="ot-kv"><span>OT hours</span><span>${fmtHrs(sched.otHours)}</span></div>
          <div class="ot-kv"><span>OT $</span><span>${fmt$(sched.otDollars)}</span></div>
          <div class="ot-kv"><span>Earnings</span><span>${fmt$(sched.earnings)}</span></div>
          <div class="ot-kv"><span>Headcount</span><span>${sched.headcount||0}</span></div>

          <div class="ot-kv"><span>Hours</span><span>${fmtHrs(nons.hours)}</span></div>
          <div class="ot-kv"><span>Non-scheduled OT $</span><span>${fmt$(nons.otDollars)}</span></div>
          <div class="ot-kv"><span>OT hours</span><span>${fmtHrs(nons.otHours)}</span></div>
          <div class="ot-kv"><span>Total non-scheduled labor $</span><span>${fmt$(nons.earnings)}</span></div>
          <div class="ot-kv"><span>Headcount</span><span>${nons.headcount||0}</span></div>
        </div>
      </div>
      <div class="ot-note" style="margin:12px 0 0">Nobody is scheduled on a non-scheduled day, so every hour worked Fri–Sun is incremental.
        Two different numbers matter and they are not interchangeable: <strong>non-scheduled OT $ (${fmt$(nons.otDollars)})</strong> is the premium portion, comparable against the pre-approved allowance;
        <strong>total non-scheduled labor $ (${fmt$(nons.earnings)})</strong> is every dollar paid for weekend work, which is the real cost of running those days.</div>
    </div>`;

  // 4. Departments
  const rec=(r.issues&&r.issues.reconciliation)||null;
  const reconBlock=!rec?'':(rec.balanced
    ? `<div class="ot-ok" style="margin-top:10px">✓ Department rows reconcile to the weekly totals.</div>`
    : `<div class="ot-flag" style="margin-top:10px"><strong>Departments do not reconcile to the weekly totals.</strong>
        Hours: departments ${fmtHrs(rec.departmentHours)} vs summary ${fmtHrs(rec.summaryHours)} — delta <strong>${fmtHrs(rec.hoursDelta!=null?rec.hoursDelta:(rec.departmentHours||0)-(rec.summaryHours||0))}</strong>.
        Earnings: departments ${fmt$(rec.departmentEarnings)} vs summary ${fmt$(rec.summaryEarnings)} — delta <strong>${fmt$(rec.earningsDelta!=null?rec.earningsDelta:(rec.departmentEarnings||0)-(rec.summaryEarnings||0))}</strong>.</div>`);

  const deptBlock=`
    <div class="section-head"><span>By department</span></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Department</th>
          <th class="num">Sched hrs</th><th class="num">Sched $</th>
          <th class="num">Weekend hrs</th><th class="num">Weekend $</th>
          <th class="num">OT hrs</th><th class="num">OT $</th>
          <th class="num">Pre-appr hrs</th><th class="num">Pre-appr $</th>
          <th class="num">Net OT hrs</th><th class="num">Net OT $</th>
          <th class="num">Total labor $</th>
        </tr></thead>
        <tbody>
          ${depts.length?depts.map(d=>`<tr${d.department==='Unassigned'?' style="background:#fef5e8"':''}>
            <td style="font-weight:600">${esc(d.department)}</td>
            <td class="num">${fmtHrs((d.scheduled||{}).hours)}</td><td class="num">${fmt$((d.scheduled||{}).earnings)}</td>
            <td class="num">${fmtHrs((d.weekend||{}).hours)}</td><td class="num">${fmt$((d.weekend||{}).earnings)}</td>
            <td class="num">${fmtHrs((d.week||{}).otHours)}</td><td class="num">${fmt$((d.week||{}).otDollars)}</td>
            <td class="num">${fmtHrs(d.preApprovedHours)}</td><td class="num">${fmt$(d.preApprovedDollars)}</td>
            <td class="num" style="font-weight:700;color:${(d.netOtHours||0)>0?'var(--brick)':'inherit'}">${fmtHrs(d.netOtHours)}</td>
            <td class="num" style="font-weight:700">${fmt$(d.netOtDollars)}</td>
            <td class="num">${fmt$((d.week||{}).earnings)}</td>
          </tr>`).join(''):'<tr><td colspan="12" style="text-align:center;color:var(--muted);padding:24px">No departments in this week</td></tr>'}
        </tbody>
      </table>
    </div>
    ${reconBlock}`;

  // 5. Per-day breakdown Mon->Sun, filterable by department.
  const dayRows=days.map(d=>{
    const workers=(d.workers||[]).filter(w=>dayDept==='all'||(w.department||'Unassigned')===dayDept);
    const t=dayDept==='all'
      ? {hours:d.hours,otHours:d.otHours,otDollars:d.otDollars,earnings:d.earnings,headcount:d.headcount}
      : workers.reduce((a,w)=>({hours:a.hours+(+w.hours||0),otHours:a.otHours+(+w.otHours||0),otDollars:a.otDollars+(+w.otDollars||0),earnings:a.earnings+(+w.earnings||0),headcount:a.headcount+1}),{hours:0,otHours:0,otDollars:0,earnings:0,headcount:0});
    const open=state.otOpenDays[d.date]===undefined?!d.isScheduledDay:state.otOpenDays[d.date];
    // dateSource is null on an empty day, one value when the rows agree and a
    // comma-joined list when they disagree, so test for containment.
    const inferred=String(d.dateSource||'').includes('email_received');
    const row=`<tr class="${d.isScheduledDay?'':'nonsched-row'}">
      <td style="font-weight:600">${d.dayName||dayNameOf(d.date)}<div style="font-size:11px;color:var(--muted);font-weight:400">${fmtDate(d.date)}</div></td>
      <td>${schedBadge(d.isScheduledDay)}${inferred?'<div style="font-size:10px;color:#9a600a;margin-top:3px">date inferred from email arrival</div>':''}</td>
      <td class="num">${d.hasData?(t.headcount||0):'—'}</td>
      <td class="num">${d.hasData?fmtHrs(t.hours):'—'}</td>
      <td class="num">${d.hasData?fmtHrs(t.otHours):'—'}</td>
      <td class="num">${d.hasData?fmt$(t.otDollars):'—'}</td>
      <td class="num">${d.hasData?fmt$(t.earnings):'—'}</td>
      <td>${workers.length?`<button class="btn btn-outline btn-sm" onclick="toggleOtDay('${d.date}')">${open?'Hide':'Who worked'}</button>`:'<span style="color:var(--muted)">no rows</span>'}</td>
    </tr>`;
    const detail=(open&&workers.length)?`<tr class="day-workers"><td colspan="8">
      ${workers.slice().sort((a,b)=>(b.hours||0)-(a.hours||0)).map(w=>`<span class="ot-chip">${esc(w.name||('#'+w.employeeNumber))} · ${fmtHrs(w.hours)}h${(w.otHours||0)>0?' · OT '+fmtHrs(w.otHours)+'h':''} · ${fmt$(w.earnings)}<span style="color:var(--muted)"> · ${esc(w.department||'Unassigned')}</span></span>`).join('')}
    </td></tr>`:'';
    return row+detail;
  }).join('');

  const dayBlock=`
    <div class="section-head">
      <span>Day by day · Monday to Sunday</span>
      <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted)">
        Department:
        <select onchange="state.otDayDept=this.value;render()" style="font-family:var(--font);font-size:12px;border:1px solid var(--border);border-radius:4px;padding:4px 8px">
          <option value="all" ${dayDept==='all'?'selected':''}>All</option>
          ${deptNames.map(n=>`<option value="${esc(n)}" ${dayDept===n?'selected':''}>${esc(n)}</option>`).join('')}
        </select>
      </span>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th style="width:130px">Day</th><th style="width:190px">Classification</th><th class="num">People</th><th class="num">Hours</th><th class="num">OT hrs</th><th class="num">OT $</th><th class="num">Earnings</th><th style="width:120px"></th></tr></thead>
        <tbody>${dayRows||'<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:24px">No days in this week</td></tr>'}</tbody>
      </table>
    </div>`;

  // 6. Weekend labor as its own block — small headcount, so name names.
  const weekendDays=days.filter(d=>!d.isScheduledDay&&d.hasData);
  const weekendPeople={};
  weekendDays.forEach(d=>(d.workers||[]).forEach(w=>{
    const k=w.employeeNumber||w.name;
    if(!weekendPeople[k]) weekendPeople[k]={name:w.name,department:w.department,hours:0,otHours:0,earnings:0,days:[]};
    weekendPeople[k].hours+=(+w.hours||0);
    weekendPeople[k].otHours+=(+w.otHours||0);
    weekendPeople[k].earnings+=(+w.earnings||0);
    weekendPeople[k].days.push(d.dayName||dayNameOf(d.date));
  }));
  const weekendList=Object.values(weekendPeople).sort((a,b)=>b.hours-a.hours);
  const weekendBlock=`
    <div class="section-head"><span>Weekend labor · Friday to Sunday</span></div>
    <div class="ot-panel">
      <div class="ot-split">
        <div class="ot-split-card nonsched">
          <div class="ot-split-hdr">Weekend totals</div>
          <div class="ot-kv"><span>Hours</span><span>${fmtHrs(s.weekendHours)}</span></div>
          <div class="ot-kv"><span>Total weekend labor $</span><span>${fmt$(s.weekendDollars)}</span></div>
          <div class="ot-kv"><span>OT hours</span><span>${fmtHrs(s.weekendOtHours)}</span></div>
          <div class="ot-kv"><span>Weekend OT $</span><span>${fmt$(s.weekendOtDollars)}</span></div>
          <div class="ot-kv"><span>People</span><span>${s.weekendHeadcount||0}</span></div>
        </div>
        <div style="grid-column:span 2">
          <div class="ot-split-hdr">Who worked the weekend</div>
          <div style="font-size:11px;color:var(--muted);margin-bottom:8px">Friday counts as weekend here: these are the same Fri–Sun rows as the non-scheduled block above, so scheduled plus weekend equals the whole week.</div>
          ${weekendList.length?`<div class="table-wrap" style="margin-bottom:0"><table>
            <thead><tr><th>Employee</th><th>Department</th><th>Days</th><th class="num">Hours</th><th class="num">OT hrs</th><th class="num">Earnings</th></tr></thead>
            <tbody>${weekendList.map(w=>`<tr>
              <td style="font-weight:600">${esc(w.name||'—')}</td>
              <td>${esc(w.department||'Unassigned')}</td>
              <td style="color:var(--muted);font-size:11px">${w.days.join(', ')}</td>
              <td class="num">${fmtHrs(w.hours)}</td>
              <td class="num">${fmtHrs(w.otHours)}</td>
              <td class="num">${fmt$(w.earnings)}</td>
            </tr>`).join('')}</tbody>
          </table></div>`:'<div style="font-size:12px;color:var(--muted)">Nobody has weekend rows in this week.</div>'}
        </div>
      </div>
    </div>`;

  // 7. Per-employee, sortable, with scheduled and non-scheduled split apart.
  const empCols=[
    ['name','Employee'],['department','Department'],
    ['scheduledHours','Sched hrs'],['scheduledEarnings','Sched $'],
    ['nonScheduledHours','Non-sched hrs'],['nonScheduledEarnings','Non-sched $'],
    ['otHours','OT hrs'],['otDollars','OT $'],
    ['preApprovedHours','Pre-appr hrs'],['netOtHours','Net OT hrs'],['netOtDollars','Net OT $'],
    ['totalHours','Total hrs'],['totalEarnings','Total $']
  ];
  const sortCol=state.otSortCol||'netOtDollars';
  const dir=state.otSortDir==='asc'?1:-1;
  const empRows=(r.employees||[]).slice().sort((a,b)=>{
    const av=a[sortCol], bv=b[sortCol];
    if(typeof av==='number'||typeof bv==='number') return ((+av||0)-(+bv||0))*dir;
    return String(av||'').toLowerCase()<String(bv||'').toLowerCase()?-dir:String(av||'').toLowerCase()>String(bv||'').toLowerCase()?dir:0;
  });
  const empBlock=`
    <div class="section-head"><span>By employee</span></div>
    <div class="table-wrap">
      <table>
        <thead><tr>${empCols.map(([c,label])=>`<th class="sortable${c==='name'||c==='department'?'':' num'}" onclick="otSort('${c}')">${label}${sortCol===c?'<span style="color:var(--orange);margin-left:3px">'+(state.otSortDir==='asc'?'↑':'↓')+'</span>':''}</th>`).join('')}</tr></thead>
        <tbody>
          ${empRows.length?empRows.map(e=>`<tr>
            <td style="font-weight:600">${esc(e.name||'')}${e.onRoster?'':' <span class="badge disc">not on roster</span>'}${(e.totalHours||0)===0?' <span class="badge inactive">no hours</span>':''}<div style="font-size:10px;color:var(--muted);font-weight:400">${e.employeeNumber?'#'+esc(e.employeeNumber):'no employee number'}</div></td>
            <td>${esc(e.department||'Unassigned')}</td>
            <td class="num">${fmtHrs(e.scheduledHours)}</td><td class="num">${fmt$(e.scheduledEarnings)}</td>
            <td class="num"${(e.nonScheduledHours||0)>0?' style="font-weight:700;background:#fffdf7"':''}>${fmtHrs(e.nonScheduledHours)}</td>
            <td class="num"${(e.nonScheduledHours||0)>0?' style="background:#fffdf7"':''}>${fmt$(e.nonScheduledEarnings)}</td>
            <td class="num">${fmtHrs(e.otHours)}</td><td class="num">${fmt$(e.otDollars)}</td>
            <td class="num">${fmtHrs(e.preApprovedHours)}</td>
            <td class="num" style="font-weight:700;color:${(e.netOtHours||0)>0?'var(--brick)':'inherit'}">${fmtHrs(e.netOtHours)}</td>
            <td class="num">${fmt$(e.netOtDollars)}</td>
            <td class="num">${fmtHrs(e.totalHours)}</td><td class="num">${fmt$(e.totalEarnings)}</td>
          </tr>`).join(''):'<tr><td colspan="13" style="text-align:center;color:var(--muted);padding:24px">No employees worked this week</td></tr>'}
        </tbody>
      </table>
    </div>`;

  // 8. Completeness. A Saturday with no rows because nobody worked and a Saturday
  // with no rows because the email never arrived look identical in the data, so
  // they get their own status instead of being rendered as fine.
  const comp=r.completeness||{days:[]};
  // Four states, not three. A scheduled day that has not happened yet comes back
  // expected:false and must not read as a missed delivery — nor as the Fri–Sun
  // "nobody worked, or no report arrived" case, which is a genuine unknown.
  const compState=d=>d.hasData?'data'
    :(d.isScheduledDay&&d.expected===false)?'pending'
    :d.status==='missing'?'missing'
    :'unknown';
  const compClass={data:'data',missing:'missing',pending:'pending',unknown:'unknown'};
  const compText={
    missing:'no data — scheduled day, probable missed delivery',
    pending:'not due yet — this day has not happened',
    unknown:'no data — nobody worked, or no report arrived'
  };
  const compBlock=`
    <div class="section-head"><span>Data completeness</span></div>
    <div class="ot-panel">
      <div class="comp-grid">
        ${(comp.days||[]).map(d=>{const st=compState(d);return `<div class="comp-day ${compClass[st]}">
          <div class="comp-name">${(d.dayName||dayNameOf(d.date)).slice(0,3)}</div>
          <div style="color:var(--muted);font-size:10px">${fmtDateShort(d.date)}</div>
          <div class="comp-status">${st==='data'?(d.rowCount||0)+' rows':compText[st]}</div>
        </div>`;}).join('')}
      </div>
      <div style="font-size:11px;color:var(--muted);margin-top:10px">
        ${comp.scheduledDaysWithData||0} of ${comp.scheduledDaysExpected||0} scheduled days have data${(comp.missingScheduledDays||[]).length?` · <span style="color:var(--brick);font-weight:700">missing: ${(comp.missingScheduledDays||[]).map(fmtDate).join(', ')}</span>`:''}
      </div>
    </div>`;

  // 9. Issues
  const iss=r.issues||{};
  const pre=r.preApproved||{};
  const issueBits=[];
  if((iss.unknownEmployeeNumbers||[]).length) issueBits.push(`<div class="ot-flag"><strong>${iss.unknownEmployeeNumbers.length} employee number(s) in daily hours are not on the roster:</strong> ${iss.unknownEmployeeNumbers.map(esc).join(', ')}
    <div style="margin-top:6px"><button class="btn btn-outline btn-sm" onclick="openBackfillScreen()">Back-fill payroll fields</button></div></div>`);
  if(iss.unassignedRows) issueBits.push(`<div class="ot-warn"><strong>${iss.unassignedRows} row(s) carry no department.</strong> ${(iss.unassignedEmployees||[]).map(esc).join(', ')}
    <div style="font-size:11px;margin-top:4px">Set the department on the employee, then re-stamp the affected dates from the Daily Hours tab — the department on a daily row is a snapshot taken at import.</div>
    <div style="margin-top:6px"><button class="btn btn-outline btn-sm" onclick="openBackfillScreen()">Back-fill payroll fields</button>
    <button class="btn btn-outline btn-sm" onclick="goToTab('dailyhours')">Re-stamp departments</button></div></div>`);
  if((iss.flagged||[]).length) issueBits.push(`<div class="ot-flag"><strong>${iss.flagged.length} flagged row(s):</strong>
    <div style="margin-top:6px">${iss.flagged.map(f=>`<span class="ot-chip">${fmtDateShort(f.workDate)} · ${esc(f.name||('#'+f.employeeNumber))} · ${(f.flags||[]).map(esc).join(', ')}</span>`).join('')}</div></div>`);
  if((pre.unmatchedNames||[]).length) issueBits.push(`<div class="ot-warn"><strong>Pre-approved OT names that match no employee:</strong> ${pre.unmatchedNames.map(esc).join(', ')}</div>`);
  if((pre.withoutHoursThisWeek||[]).length) issueBits.push(`<div class="ot-warn"><strong>Pre-approved but no hours this week:</strong>
    ${pre.withoutHoursThisWeek.map(p=>`<span class="ot-chip">${esc(p.name)} · ${esc(p.department||'Unassigned')} · ${fmtHrs(p.hours)}h · ${fmt$(p.dollars)}</span>`).join('')}
    <div style="font-size:11px;margin-top:4px">Their allowance still counts against net OT, so it is worth knowing they did not work.</div></div>`);
  if((pre.rateMissing||[]).length) issueBits.push(`<div class="ot-warn"><strong>Pre-approved dollars show as $0 for:</strong> ${pre.rateMissing.map(esc).join(', ')}
    <div style="font-size:11px;margin-top:4px">Their allowance is not free — no pay rate exists for them in this week's daily hours or on the employee record, so the dollars cannot be derived. Their hours still count.</div></div>`);
  const issueBlock=`
    <div class="section-head"><span>Issues</span></div>
    <div class="ot-panel">${issueBits.length?issueBits.join(''):'<div class="ot-ok">✓ No data issues in this week.</div>'}</div>`;

  // Iterate the keys: a blank ot_type comes back as its own bucket.
  const byType=pre.byType||{};
  const preTypeBlock=`
    <div class="section-head"><span>Pre-approved OT by type</span></div>
    <div class="ot-panel">
      <div class="ot-split">
        ${Object.keys(byType).length?Object.keys(byType).map(t=>`<div class="ot-split-card">
          <div class="ot-split-hdr">${esc(t)}</div>
          <div class="ot-kv"><span>Hours</span><span>${fmtHrs((byType[t]||{}).hours)}</span></div>
          <div class="ot-kv"><span>Derived $</span><span>${fmt$((byType[t]||{}).dollars)}</span></div>
        </div>`).join(''):'<div style="font-size:12px;color:var(--muted)">No pre-approved OT on file.</div>'}
      </div>
    </div>`;

  return otReportStyle+picker+trunc+`
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">Week of ${fmtDate(r.weekStart)} through ${fmtDate(r.weekEnd)}</div>
    ${cards}${standingNote}${splitBlock}${deptBlock}${dayBlock}${weekendBlock}${empBlock}${compBlock}${preTypeBlock}${issueBlock}`;
}

// ============================================================
// TEXTBOLT LIST
// ============================================================
function copyTextBoltList() {
  const addresses = state.employees
    .filter(e => e.status === 'Active' && !e.smsOptedOut)
    .map(e => textBoltAddress(e.phone))
    .filter(Boolean);

  if (!addresses.length) {
    toast('No active opted-in employees found', 'error');
    return;
  }

  const list = addresses.join(', ');
  navigator.clipboard.writeText(list).then(() => {
    const btn = document.getElementById('copyTBBtn');
    btn.textContent = '✓ Copied ' + addresses.length + ' addresses';
    btn.style.color = '#2a7a47';
    btn.style.borderColor = '#2a7a47';
    toast(addresses.length + ' TextBolt addresses copied to clipboard', 'success');
    setTimeout(() => {
      btn.textContent = '📋 Copy TextBolt list';
      btn.style.color = '';
      btn.style.borderColor = '';
    }, 3000);
  }).catch(() => {
    // Fallback for browsers that block clipboard
    const ta = document.createElement('textarea');
    ta.value = list;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast(addresses.length + ' addresses copied', 'success');
  });
}

function loadDriveLink(employeeName) {
  const el = document.getElementById('driveLinkArea');
  if (!el) return;
  el.innerHTML = '<div style="font-size:12px;color:var(--muted)">Looking up folder…</div>';

  fetch('/api/documents?employee=' + encodeURIComponent(employeeName))
    .then(r => r.json())
    .then(data => {
      const link = data.folderLink || null;
      if (link) {
        el.innerHTML = `<a href="${link}" target="_blank" class="btn btn-outline btn-sm" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
          Open HR File in Drive
        </a>`;
      } else {
        el.innerHTML = '<div style="font-size:12px;color:var(--muted)">No folder found — will be created on first upload via Drive</div>';
      }
    })
    .catch(() => {
      el.innerHTML = '<div style="font-size:12px;color:var(--muted)">Could not load folder link</div>';
    });
}

// ============================================================
// OVERTIME CRUD
// ============================================================
function typeToKey(t){ return t==='Post-Shift'?'post':t==='Pre-Shift'?'pre':'weekend'; }

function addOT(type){
  type=type||'post';
  const otType=type==='post'?'Post-Shift':type==='pre'?'Pre-Shift':'Weekend';
  state.ot[type].push({name:'',hours:1,desc:'',otType});
  state.dirty=true; render();
}

function updateOT(type,idx,field,val){
  if(field==='otType'){
    // Move to different type array
    const rec={...state.ot[type][idx],otType:val};
    state.ot[type].splice(idx,1);
    state.ot[typeToKey(val)].push(rec);
  } else {
    state.ot[type][idx][field]=val;
  }
  state.dirty=true;
}

function deleteOT(type,idx){
  if(!confirm('Remove this OT assignment?')) return;
  state.ot[type].splice(idx,1);
  state.dirty=true; render();
}

async function saveOT(){
  const rows=[];
  state.ot.pre.forEach(r=>{if(r.name)rows.push({name:r.name,ot_type:'Pre-Shift',hours:r.hours||0,description:r.desc||''});});
  state.ot.post.forEach(r=>{if(r.name)rows.push({name:r.name,ot_type:'Post-Shift',hours:r.hours||0,description:r.desc||''});});
  state.ot.weekend.forEach(r=>{if(r.name)rows.push({name:r.name,ot_type:'Weekend',hours:r.hours||0,description:r.desc||''});});
  try{
    const res=await fetch('/api/data?table=overtime',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows})});
    if(!res.ok) throw new Error();
    toast('Overtime saved','success'); state.dirty=false;
    // Reload to get new ids
    const fresh=await fetch('/api/data?table=overtime');
    const d=await fresh.json();
    state.ot={pre:[],post:[],weekend:[]};
    (d.data||[]).forEach(r=>{
      const rec={id:r.id,name:r.name,hours:parseFloat(r.hours)||0,desc:r.description||''};
      if(r.ot_type==='Pre-Shift')state.ot.pre.push(rec);
      else if(r.ot_type==='Post-Shift')state.ot.post.push(rec);
      else state.ot.weekend.push(rec);
    });
    state.otEditing=false; render();
  }catch(e){ toast('Save failed: '+e.message,'error'); }
}

function addPoint(){
  state.points.push({name:'',points:0,lastDate:'',levelElig:'',disciplinary:false,discDate:''});
  state.dirty=true; render();
}

function updatePoint(idx,field,val){
  // Find the actual index in the sorted array — we need to map back
  const sorted=[...state.points].sort((a,b)=>b.points-a.points);
  const orig=sorted[idx];
  const realIdx=state.points.indexOf(orig);
  if(realIdx===-1) return;
  state.points[realIdx][field]=val;
  state.dirty=true;
}

function deletePoint(idx){
  if(!confirm('Delete this points entry?')) return;
  const sorted=[...state.points].sort((a,b)=>b.points-a.points);
  const orig=sorted[idx];
  const realIdx=state.points.indexOf(orig);
  if(realIdx!==-1) state.points.splice(realIdx,1);
  state.dirty=true; render();
}

async function savePoints(){
  const rows=state.points.filter(p=>p.name).map(p=>({
    name:p.name, points:p.points||0, last_point_date:p.lastDate||'',
    level_up_eligible:p.levelElig||'', disciplinary:p.disciplinary||false,
    disc_date:p.discDate||''
  }));
  try{
    const res=await fetch('/api/data?table=points',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows})});
    if(!res.ok) throw new Error();
    toast('Points saved','success'); state.dirty=false;
    // Reload
    const fresh=await fetch('/api/data?table=points');
    const d=await fresh.json();
    state.points=(d.data||[]).map(r=>({
      id:r.id,name:r.name,points:r.points||0,lastDate:r.last_point_date||'',
      levelElig:r.level_up_eligible||'',disciplinary:r.disciplinary||false,discDate:r.disc_date||''
    }));
    state.ptEditing=false; render();
  }catch(e){ toast('Save failed: '+e.message,'error'); }
}
