<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staffing Master — Sequoia Forest Products</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!--SESSION_DATA-->
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    :root{
      --orange:#EE7425;--rust:#AD4C25;--wine:#4B1A21;--gold:#EFBA62;--brick:#902423;--teal:#004C56;
      --nearBlk:#27211E;--cream:#EAD9CA;--bg:#F5F0EB;--surface:#FFFFFF;--surface2:#F0E8E0;
      --border:#DDD0C4;--muted:#9A8070;--text:#27211E;--textDim:#6B5448;
      --font:Montserrat,Arial,sans-serif;
    }
    body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;}

    /* HEADER — exact match to Maintenance System */
    .sfp-header{background:var(--nearBlk);border-bottom:2px solid var(--rust);position:sticky;top:0;z-index:50;}
    .sfp-header-inner{max-width:1300px;margin:0 auto;padding:0 20px;}
    .sfp-header-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 0;flex-wrap:wrap;gap:10;}
    .sfp-logo-row{display:flex;align-items:center;gap:14px;}
    .sfp-logo-block{background:var(--rust);border-radius:4px;padding:6px 12px;display:flex;align-items:center;}
    .sfp-logo-block img{height:28px;width:auto;}
    .sfp-title-block{display:flex;flex-direction:column;}
    .sfp-system-name{color:var(--orange);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:2px;}
    .sfp-page-name{color:#F0E6DC;font-size:17px;font-weight:800;line-height:1.1;}
    .sfp-header-actions{display:flex;gap:8px;align-items:center;}
    .sfp-sync-status{font-size:11px;font-family:var(--font);}
    .sfp-sync-status.idle{color:#4A7C59;}
    .sfp-sync-status.saving{color:var(--orange);}
    .sfp-sync-status.error{color:var(--brick);}
    .sfp-user-pill{display:flex;align-items:center;gap:8px;}
    .sfp-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--rust);}
    .sfp-user-name{color:#94a3b8;font-size:12px;}
    .sfp-btn{font-family:var(--font);font-size:12px;font-weight:700;padding:8px 20px;border-radius:4px;cursor:pointer;border:none;background:var(--orange);color:#fff;}
    .sfp-btn:hover{background:var(--rust);}
    .sfp-btn-outline{background:none;border:1px solid #3D2E26;color:#F0E6DC;border-radius:4px;padding:6px 14px;font-size:12px;font-weight:600;font-family:var(--font);cursor:pointer;}
    .sfp-btn-outline:hover{border-color:var(--muted);}
    .sfp-btn-sm{font-size:11px;padding:5px 12px;}
    .sfp-sync-btn{font-family:var(--font);font-size:11px;font-weight:700;padding:6px 14px;border-radius:4px;cursor:pointer;border:none;background:var(--orange);color:#fff;}
    .sfp-sync-btn:hover{background:var(--rust);}
    .sfp-sync-btn.saving{background:transparent;color:var(--orange);border:1px solid var(--orange);}
    .sfp-sync-btn.saved{background:transparent;color:#4A7C59;border:1px solid #4A7C59;}

    /* NAV TABS — exact match */
    .sfp-tabs{display:flex;gap:2px;margin-top:12px;}
    .sfp-tab{padding:10px 16px;background:none;border:none;border-bottom:2px solid transparent;color:#94a3b8;cursor:pointer;font-size:13px;font-weight:400;font-family:var(--font);position:relative;transition:color .15s;}
    .sfp-tab.active{border-bottom-color:var(--orange);color:var(--orange);font-weight:600;}
    .sfp-tab:hover:not(.active){color:#cbd5e1;}

    /* CONTENT */
    .sfp-content{max-width:1300px;margin:0 auto;padding:24px 20px;}

    /* STAT CARDS */
    .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px;}
    .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;}
    .stat-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
    .stat-value{font-size:26px;font-weight:800;color:var(--text);line-height:1;}
    .stat-sub{font-size:11px;color:var(--muted);margin-top:4px;}

    /* SECTION HEADER */
    .section-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--rust);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}

    /* TABLE */
    .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:24px;}
    table{width:100%;border-collapse:collapse;font-size:13px;}
    th{background:var(--surface2);color:var(--textDim);font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:10px 12px;text-align:left;white-space:nowrap;}
    td{padding:10px 12px;border-bottom:1px solid var(--border);color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px;}
    tr:last-child td{border-bottom:none;}
    tr:hover td{background:var(--surface2);}

    /* BADGES */
    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;}
    .badge.active{background:#e8f5ec;color:#2a7a47;}
    .badge.inactive{background:var(--surface2);color:var(--muted);}
    .badge.en{background:#eef3fc;color:#3a5fa0;}
    .badge.es{background:#fef5e8;color:#9a600a;}
    .badge.disc{background:#fce8e8;color:var(--brick);}

    /* BUTTONS */
    .btn{font-family:var(--font);font-size:12px;font-weight:700;padding:6px 14px;border-radius:4px;cursor:pointer;}
    .btn-primary{background:var(--orange);color:#fff;border:none;}
    .btn-primary:hover{background:var(--rust);}
    .btn-outline{background:none;color:var(--rust);border:1px solid var(--border);}
    .btn-outline:hover{border-color:var(--orange);color:var(--orange);}
    .btn-sm{font-size:11px;padding:4px 10px;}

    /* SEARCH ROW */
    .search-row{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
    .search-row input,.search-row select{font-family:var(--font);font-size:13px;border:1px solid var(--border);border-radius:4px;padding:7px 12px;background:var(--surface);color:var(--text);}
    .search-row input{flex:1;min-width:200px;}
    .search-row input:focus,.search-row select:focus{outline:none;border-color:var(--orange);}

    /* WAGE BARS */
    .wage-wrap{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:24px;}
    .wage-sec-hdr{background:var(--surface2);padding:7px 16px;font-size:10px;font-weight:700;color:var(--rust);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);}
    .wage-row{display:flex;align-items:center;gap:12px;padding:9px 16px;border-bottom:1px solid var(--border);font-size:12.5px;}
    .wage-row:last-child{border-bottom:none;}
    .w-name{width:140px;flex-shrink:0;font-weight:600;}
    .w-pos{width:160px;flex-shrink:0;color:var(--muted);font-size:11px;}
    .w-bar-bg{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;}
    .w-bar-fill{height:100%;border-radius:2px;}
    .w-amt{width:52px;text-align:right;font-weight:700;flex-shrink:0;}
    .w-var{width:64px;text-align:right;flex-shrink:0;}
    .var-pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;}
    .var-over{background:#fce8e8;color:var(--brick);}
    .var-under{background:#e8f5ec;color:#2a7a47;}
    .var-even{background:var(--surface2);color:var(--muted);}

    /* OT */
    .ot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:24px;}
    .ot-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
    .ot-name{font-size:13px;font-weight:600;}
    .ot-desc{font-size:11px;color:var(--muted);margin-top:2px;}
    .ot-hrs{font-size:15px;font-weight:800;color:var(--rust);flex-shrink:0;margin-left:12px;}

    /* MODAL */
    .modal-bg{position:fixed;inset:0;background:rgba(27,22,18,.65);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
    .modal{background:var(--surface);border-radius:8px;width:100%;max-width:540px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;}
    .modal-title{font-size:15px;font-weight:800;color:var(--text);display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;}
    .close-btn{background:none;border:none;font-size:22px;cursor:pointer;color:var(--muted);line-height:1;}
    .close-btn:hover{color:var(--text);}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .form-group{display:flex;flex-direction:column;gap:5px;}
    .form-group.full{grid-column:span 2;}
    .form-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
    .form-group input,.form-group select{font-family:var(--font);font-size:13px;border:1px solid var(--border);border-radius:4px;padding:8px 10px;color:var(--text);background:var(--surface);}
    .form-group input:focus,.form-group select:focus{outline:none;border-color:var(--orange);}
    .modal-body{flex:1;overflow-y:auto;padding:28px;}
    .modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--border);background:var(--surface);border-radius:0 0 8px 8px;flex-shrink:0;}

    /* POINTS */
    .pt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

    /* TOAST */
    .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:6px;font-size:13px;font-weight:700;z-index:300;font-family:var(--font);opacity:0;transition:opacity .2s;pointer-events:none;}
    .toast.show{opacity:1;}
    .toast.success{background:#2a7a47;color:#fff;}
    .toast.error{background:var(--brick);color:#fff;}
    .loading-state{padding:80px;text-align:center;color:var(--muted);font-size:13px;}

    /* DOCUMENTS */
    .doc-tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:16px;}
    .doc-tab{padding:8px 16px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;font-family:var(--font);}
    .doc-tab.active{color:var(--orange);border-bottom-color:var(--orange);}
    .doc-list{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow-y:auto;}
    .doc-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:6px;border:1px solid var(--border);}
    .doc-icon{width:32px;height:32px;border-radius:4px;background:var(--rust);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:white;font-weight:700;}
    .doc-name{font-size:12.5px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .doc-meta{font-size:11px;color:var(--muted);}
    .doc-actions{display:flex;gap:6px;flex-shrink:0;}
    .upload-zone{border:2px dashed var(--border);border-radius:8px;padding:24px;text-align:center;cursor:pointer;transition:border-color 0.15s;}
    .upload-zone:hover{border-color:var(--orange);}
    .upload-zone.dragover{border-color:var(--orange);background:rgba(238,116,37,0.05);}
    .upload-zone input[type=file]{display:none;}
    .upload-zone-label{font-size:13px;color:var(--muted);}
    .upload-zone-label span{color:var(--orange);font-weight:600;}
    .upload-form{display:flex;flex-direction:column;gap:12px;margin-top:14px;}
    .progress-bar{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin-top:8px;}
    .progress-fill{height:100%;background:var(--orange);border-radius:2px;transition:width 0.3s;}
  </style>
</head>

        </div>
        <button class="sfp-btn-outline" onclick="location.href='/api/logout'">Sign out</button>
      </div>
    </div>
    <div class="sfp-tabs">
      <button class="sfp-tab active" onclick="switchTab('employees',this)">Employees</button>
      <button class="sfp-tab" onclick="switchTab('economics',this)">Staffing Economics</button>
      <button class="sfp-tab" onclick="switchTab('overtime',this)">Overtime</button>
      <button class="sfp-tab" onclick="switchTab('points',this)">Points Tracker</button>
      <button class="sfp-tab" onclick="switchTab('otreport',this)">OT Report</button>
    </div>
  </div>
</header>

<main class="sfp-content" id="tabContent">
  <div class="loading-state">Loading staffing data…</div>
</main>

<div class="toast" id="toast"></div>

<script>
const user = window.__SFP_USER__ || {};
document.getElementById('userName').textContent = user.name || user.email || '';
if (user.picture) document.getElementById('userAvatar').src = user.picture;

let state = {
  tab:'employees', employees:[], economics:[],
  ot:{post:[],friday:[],pre:[]}, points:[],
  filterName:'', filterDept:'all', filterStatus:'Active',
  editing:null, dirty:false, loading:true, otEditing:false, ptEditing:false,
  sortCol:'name', sortDir:'asc',
  burden:0.44, mhr:15.0
};

function fmt$(n){return n==null?'—':'$'+Number(n).toFixed(2);}
function fmtWage(w){return !w||w==='Salary'?'Salary':('$'+parseFloat(String(w).replace(/[$,]/g,'')).toFixed(2));}

async function loadData(){
  try{
    const [empRes, econRes, otRes, ptRes, whRes] = await Promise.all([
      fetch('/api/data?table=employees'),
      fetch('/api/data?table=economics'),
      fetch('/api/data?table=overtime'),
      fetch('/api/data?table=points'),
      fetch('/api/data?table=weekly_hours').catch(()=>({ok:true,json:()=>({data:[]})}))
    ]);
    if(empRes.status===401){location.href='/';return;}

    const [empJson, econJson, otJson, ptJson, whJson] = await Promise.all([
      empRes.json(), econRes.json(), otRes.json(), ptRes.json(),
      whRes.ok ? whRes.json() : {data:[]}
    ]);

    // Employees
    state.employees = (empJson.data||[]).map(r=>({
      id:r.id, name:r.name||'', wage:r.wage||'', dept:r.dept||'',
      status:r.status||'Active', days:r.days||'', clockIn:r.clock_in||'',
      clockOut:r.clock_out||'', break1:r.break_1||'', break2:r.break_2||'',
      birthday:r.birthday||'', phone:r.phone||'', language:r.language||'',
      email:r.email||'', textBolt:r.text_bolt||'', driveFolderId:r.drive_folder_id||'',
      empNum:r.employee_number||''
    }));

    // Economics
    state.economics = (econJson.data||[]).map(r=>({
      id:r.id, num:r.num, section:r.section||'', position:r.position||'',
      name:r.name||'', max:parseFloat(r.max_wage)||0
    }));

    // OT
    state.ot = {pre:[], post:[], weekend:[]};
    (otJson.data||[]).forEach(r=>{
      const rec={id:r.id, name:r.name, hours:parseFloat(r.hours)||0, desc:r.description||''};
      if(r.ot_type==='Pre-Shift') state.ot.pre.push(rec);
      else if(r.ot_type==='Post-Shift') state.ot.post.push(rec);
      else state.ot.weekend.push(rec);
    });

    // Points
    state.points = (ptJson.data||[]).map(r=>({
      id:r.id, name:r.name, points:r.points||0, lastDate:r.last_point_date||'',
      levelElig:r.level_up_eligible||'', disciplinary:r.disciplinary||false,
      discDate:r.disc_date||''
    }));

    // Weekly hours (payroll uploads)
    state.weeklyHours = (whJson.data||[]).map(r=>({
      id:r.id, empNum:r.employee_number, date:r.work_date,
      regular:parseFloat(r.regular_hours)||0, ot:parseFloat(r.ot_hours)||0,
      comment:r.supervisor_comment||'', batchId:r.upload_batch_id
    }));

    state.loading=false;
  }catch(e){console.error('loadData error:',e);state.loading=false;}
  render();
}

async function loadEcon(){ /* handled in loadData */ }
async function loadOT(){ /* handled in loadData */ }
async function loadPoints(){ /* handled in loadData */ }

async function loadEcon(){
  try{
    const res=await fetch('/api/sheets?range=Economics!A:G');
    const json=await res.json();
    const rows=json.values||[];
    state.economics=[];
    // Header: NUM,SECTION,POSITION,NAME,WAGE,MAX_WAGE,VARIANCE
    // Col:    0   1        2        3    4     5        6
    const header=rows[0]||[];
    // Find column indices dynamically in case order varies
    const iNum=0, iSec=1, iPos=2, iName=3, iWage=4, iMax=5;
    for(let i=1;i<rows.length;i++){
      const r=rows[i];
      if(!r[iPos]?.trim()) continue; // skip rows with no position
      const max=parseFloat(r[iMax])||0;
      state.economics.push({
        num:+r[iNum]||i,
        section:r[iSec]||'',
        position:r[iPos]||'',
        name:r[iName]||'',
        max
      });
    }
  }catch(e){console.error('loadEcon:',e);}
}

async function loadOT(){
  try{
    const res=await fetch('/api/sheets?range=Overtime!A:D');
    const json=await res.json();
    const rows=json.values||[];
    state.ot={post:[],weekend:[],pre:[]};
    // Header: NAME,OT_TYPE,HOURS,DESCRIPTION
    for(let i=1;i<rows.length;i++){
      const r=rows[i];
      if(!r[0]?.trim())continue;
      const rec={name:r[0],hours:parseFloat(r[2])||0,desc:r[3]||''};
      const type=r[1]||'';
      if(type==='Post-Shift')state.ot.post.push(rec);
      else if(type==='Weekend'||type==='Friday')state.ot.weekend.push(rec);
      else if(type==='Pre-Shift')state.ot.pre.push(rec);
    }
  }catch(e){console.error('loadOT:',e);}
}

async function loadPoints(){
  try{
    const res=await fetch('/api/sheets?range=Points!A:F');
    const json=await res.json();
    const rows=json.values||[];
    state.points=[];
    // Header: NAME,POINTS,LAST_POINT_DATE,LEVEL_UP_ELIGIBLE,DISCIPLINARY,DISCIPLINARY_DATE
    for(let i=1;i<rows.length;i++){
      const r=rows[i];
      if(!r[0]?.trim())continue;
      state.points.push({
        name:r[0],points:parseInt(r[1])||0,lastDate:r[2]||'',
        levelElig:r[3]||'',disciplinary:r[4]==='Yes',discDate:r[5]||''
      });
    }
  }catch(e){console.error('loadPoints:',e);}
}

function switchTab(tab,el){
  state.tab=tab;
  document.querySelectorAll('.sfp-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render(){
  const el=document.getElementById('tabContent');
  if(state.loading){el.innerHTML='<div class="loading-state">Loading…</div>';return;}
  if(state.tab==='employees')el.innerHTML=renderEmployees();
  else if(state.tab==='economics')el.innerHTML=renderEcon();
  else if(state.tab==='overtime')el.innerHTML=renderOT();
  else if(state.tab==='points')el.innerHTML=renderPoints();
  else if(state.tab==='otreport')el.innerHTML=renderOTReport();
}

function attachDropZones(){
  // Attach drag start to emp cards
  document.querySelectorAll('.emp-card[data-empname]').forEach(card=>{
    card.addEventListener('dragstart', e=>{
      e.dataTransfer.setData('text/plain', card.dataset.empname);
      e.dataTransfer.effectAllowed = 'move';
    });
  });
  // Attach drop to position zones
  document.querySelectorAll('.pos-drop').forEach(zone=>{
    const idx = parseInt(zone.dataset.idx);
    zone.addEventListener('dragover', e=>{e.preventDefault();zone.classList.add('drag-over');});
    zone.addEventListener('dragleave', ()=>zone.classList.remove('drag-over'));
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      zone.classList.remove('drag-over');
      econDrop(e, idx);
    });
  });
}

function getFiltered(){
  let list = state.employees.filter(e=>
    (state.filterStatus==='all'||e.status===state.filterStatus)&&
    (state.filterDept==='all'||e.dept===state.filterDept)&&
    (!state.filterName||e.name.toLowerCase().includes(state.filterName.toLowerCase()))
  );
  const col = state.sortCol || 'name';
  const dir = state.sortDir === 'desc' ? -1 : 1;
  return [...list].sort((a,b)=>{
    if(col==='wage'){
      const av=parseFloat(String(a.wage||'0').replace(/[$,]/g,''))||0;
      const bv=parseFloat(String(b.wage||'0').replace(/[$,]/g,''))||0;
      return (av-bv)*dir;
    }
    const av=String(a[col]||'').toLowerCase();
    const bv=String(b[col]||'').toLowerCase();
    return av<bv?-dir:av>bv?dir:0;
  });
}

function renderEmployees(){
  const active=state.employees.filter(e=>e.status==='Active');
  const en=active.filter(e=>e.language==='English').length;
  const es=active.filter(e=>e.language==='Spanish').length;
  const allDepts=[...new Set(state.employees.map(e=>e.dept))].filter(Boolean).sort();
  const filtered=getFiltered();
  return `
    <div class="stat-row">
      <div class="stat-card"><div class="stat-label">Active headcount</div><div class="stat-value">${active.length}</div><div class="stat-sub">of ${state.employees.length} total</div></div>
      <div class="stat-card"><div class="stat-label">English speakers</div><div class="stat-value">${en}</div><div class="stat-sub">${es} Spanish</div></div>
      <div class="stat-card"><div class="stat-label">Departments</div><div class="stat-value">${allDepts.length}</div></div>
      <div class="stat-card"><div class="stat-label">Inactive</div><div class="stat-value">${state.employees.length-active.length}</div><div class="stat-sub">on roster</div></div>
    </div>
    <div class="section-head">
      <span>Employee roster</span>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline btn-sm" onclick="copyTextBoltList()" id="copyTBBtn">📋 Copy TextBolt list</button>
        <button class="btn btn-primary btn-sm" onclick="openAdd()">+ Add employee</button>
      </div>
    </div>
    <div class="search-row">
      <input type="text" id="empSearch" placeholder="Search by name…" value="${state.filterName}" oninput="state.filterName=this.value;renderEmployeeList()">
      <select onchange="state.filterDept=this.value;renderEmployeeList()">
        <option value="all" ${state.filterDept==='all'?'selected':''}>All departments</option>
        ${allDepts.map(d=>`<option value="${d}" ${state.filterDept===d?'selected':''}>${d}</option>`).join('')}
      </select>
      <select onchange="state.filterStatus=this.value;renderEmployeeList()">
        <option value="Active" ${state.filterStatus==='Active'?'selected':''}>Active only</option>
        <option value="Inactive" ${state.filterStatus==='Inactive'?'selected':''}>Inactive</option>
        <option value="all" ${state.filterStatus==='all'?'selected':''}>All</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          ${['name','wage','dept','status','language','days','phone'].map(col=>{
            const labels={name:'Name',wage:'Wage/hr',dept:'Department',status:'Status',language:'Lang',days:'Schedule',phone:'Phone'};
            const active=state.sortCol===col;
            const arrow=active?(state.sortDir==='asc'?'↑':'↓'):'';
            return '<th style="cursor:pointer;user-select:none;white-space:nowrap" onclick="sortEmployees(\''+col+'\')">'+labels[col]+(arrow?'<span style=\"color:var(--orange);margin-left:3px\">'+arrow+'</span>':'')+'</th>';
          }).join('')}
          <th style="width:60px">SMS</th><th style="width:60px"></th>
        </tr></thead>
        <tbody>
          ${filtered.length?filtered.map(e=>`
            <tr>
              <td style="font-weight:600">${e.name}</td>
              <td>${fmtWage(e.wage)}</td>
              <td>${e.dept||'—'}</td>
              <td><span class="badge ${e.status==='Active'?'active':'inactive'}">${e.status||'—'}</span></td>
              <td><span class="badge ${e.language==='Spanish'?'es':'en'}">${e.language==='Spanish'?'ES':'EN'}</span></td>
              <td style="color:var(--muted);font-size:11px">${e.days||'—'}</td>
              <td style="color:var(--muted);font-size:11px">${e.phone||'—'}</td>
              <td style="font-size:10px;color:#c0392b;font-weight:700">${e.textBolt==='STOP'?'NO SMS':''}</td>
              <td><button class="btn btn-outline btn-sm" onclick="openEdit(${state.employees.indexOf(e)})">Edit</button></td>
            </tr>`).join(''):
            '<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:32px">No employees match</td></tr>'}
        </tbody>
      </table>
    </div>
    ${state.editing!==null?renderModal():''}
  `;
}

function formatWageInput(input) {
  const val = input.value.trim();
  if (!val || val.toLowerCase() === 'salary') {
    input.value = 'Salary';
    state.editing.wage = 'Salary';
    return;
  }
  const num = parseFloat(val.replace(/[$,]/g, ''));
  if (!isNaN(num)) {
    const formatted = '$' + num.toFixed(2);
    input.value = formatted;
    state.editing.wage = formatted;
  }
}

function sortEmployees(col) {
  if (state.sortCol === col) {
    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sortCol = col;
    state.sortDir = 'asc';
  }
  render();
}

function renderEmployeeList() {
  const filtered = getFiltered();

  // Update stat cards
  const active = state.employees.filter(e => e.status === 'Active');
  const spanish = active.filter(e => e.language === 'Spanish').length;
  const depts = [...new Set(active.map(e => e.dept).filter(Boolean))].length;
  const inactive = state.employees.filter(e => e.status === 'Inactive').length;

  const statEls = document.querySelectorAll('.stat-value');
  if (statEls.length >= 4) {
    statEls[0].textContent = active.length;
    statEls[1].textContent = active.length - spanish;
    statEls[2].textContent = depts;
    statEls[3].textContent = inactive;
  }

  // Update table body only
  const tbody = document.querySelector('.table-wrap tbody');
  if (!tbody) return;

  if (!filtered.length) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:32px">No employees match</td></tr>';
    return;
  }

  tbody.innerHTML = filtered.map(e => {
    const idx = state.employees.indexOf(e);
    return `<tr>
      <td style="font-weight:600">${e.name}</td>
      <td>${e.wage||'—'}</td>
      <td style="color:var(--muted)">${e.dept||'—'}</td>
      <td><span class="badge ${e.status==='Active'?'active':'inactive'}">${e.status}</span></td>
      <td><span class="badge ${e.language==='Spanish'?'es':'en'}">${e.language==='Spanish'?'ES':'EN'}</span></td>
      <td style="color:var(--muted);font-size:11px">${e.days||'—'}</td>
      <td style="color:var(--muted);font-size:11px">${e.phone||'—'}</td>
      <td style="font-size:10px;color:#c0392b;font-weight:700">${e.textBolt==='STOP'?'NO SMS':''}</td>
      <td><button class="btn btn-outline btn-sm" onclick="openEdit(${idx})">Edit</button></td>
    </tr>`;
  }).join('');
}

function toggleSmsOptOut(checkbox) {
  const fg = checkbox.closest('.form-group');
  const isStop = checkbox.checked;
  // If opting out, set STOP. If opting back in, restore original address.
  if (isStop) {
    state.editing.textBolt = 'STOP';
  } else {
    // Restore original from the employee record
    const orig = state.employees[state.editing._idx]?.textBolt || '';
    state.editing.textBolt = (orig && orig !== 'STOP') ? orig : '';
  }
  fg.querySelector('.sms-track').style.background = isStop ? '#c0392b' : 'var(--border)';
  fg.querySelector('.sms-thumb').style.left = isStop ? '18px' : '2px';
  fg.querySelector('.sms-label').textContent = isStop ? 'Opted out' : 'Receiving texts';
}

function openEdit(idx){
  state.editing={...state.employees[idx],_idx:idx,_isNew:false};
  render();
  // Load Drive folder link after render
  setTimeout(()=>loadDriveLink(state.employees[idx].name), 50);
}
function openAdd(){state.editing={name:'',wage:'',dept:'Sawmill',status:'Active',days:'MON-THU',clockIn:'4:55 AM',clockOut:'3:35 PM',break1:'7:00 AM',break2:'12:45 PM',birthday:'',phone:'',language:'English',email:'',_isNew:true};render();}
function closeModal(){state.editing=null;render();}

function saveEdit(){
  const e={...state.editing};const idx=e._idx;const isNew=e._isNew;
  delete e._idx;delete e._isNew;
  if(isNew)state.employees.push(e);else state.employees[idx]=e;
  state.dirty=true;state.editing=null;
  setSyncStatus('saving');
  toast('Saved locally — click Sync to write to sheet.','success');
  // Auto-create Drive folder for new employees in the background
  if(isNew && e.name){
    fetch('/api/documents?employee='+encodeURIComponent(e.name))
      .catch(()=>{}); // silent — folder creation happens server-side
  }
  render();
}

function renderModal(){
  const e=state.editing;
  const allDepts=[...new Set(state.employees.map(emp=>emp.dept))].filter(Boolean).sort();
  return `
    <div class="modal-bg" onclick="if(event.target===this)closeModal()">
      <div class="modal">
        <div class="modal-title" style="padding:20px 28px 0;flex-shrink:0">
          <span>${e._isNew?'Add employee':'Edit — '+(state.employees[e._idx]?.name||'')}</span>
          <button class="close-btn" onclick="closeModal()">×</button>
        </div>

        <div class="modal-body">
        <div id="modal-details-pane">
        <div class="form-grid">
          <div class="form-group full"><label class="form-label">Full name</label><input type="text" value="${e.name}" oninput="state.editing.name=this.value"></div>
          <div class="form-group"><label class="form-label">Wage ($/hr or Salary)</label><input type="text" value="${e.wage}" id="wageInput"
            oninput="state.editing.wage=this.value"
            onblur="formatWageInput(this)"></div>
          <div class="form-group"><label class="form-label">Department</label><select onchange="state.editing.dept=this.value">${allDepts.map(d=>`<option value="${d}" ${e.dept===d?'selected':''}>${d}</option>`).join('')}</select></div>
          <div class="form-group"><label class="form-label">Status</label><select onchange="state.editing.status=this.value"><option value="Active" ${e.status==='Active'?'selected':''}>Active</option><option value="Inactive" ${e.status==='Inactive'?'selected':''}>Inactive</option></select></div>
          <div class="form-group"><label class="form-label">Language</label><select onchange="state.editing.language=this.value"><option value="English" ${e.language==='English'?'selected':''}>English</option><option value="Spanish" ${e.language==='Spanish'?'selected':''}>Spanish</option></select></div>
          <div class="form-group"><label class="form-label">Schedule days</label><input type="text" value="${e.days}" oninput="state.editing.days=this.value"></div>
          <div class="form-group"><label class="form-label">Clock in</label><input type="text" value="${e.clockIn}" oninput="state.editing.clockIn=this.value"></div>
          <div class="form-group"><label class="form-label">Clock out</label><input type="text" value="${e.clockOut}" oninput="state.editing.clockOut=this.value"></div>
          <div class="form-group"><label class="form-label">Birthday</label><input type="text" value="${e.birthday}" oninput="state.editing.birthday=this.value"></div>
          <div class="form-group"><label class="form-label">Phone</label><input type="text" value="${e.phone}" oninput="state.editing.phone=this.value"></div>
          <div class="form-group full"><label class="form-label">Email</label><input type="text" value="${e.email}" oninput="state.editing.email=this.value"></div>
          <div class="form-group full" style="padding:10px 12px;background:var(--surface2);border-radius:6px;border:1px solid var(--border)">
            <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none">
              <div>
                <div style="font-size:12px;font-weight:700;color:var(--text)">SMS opt-out</div>
                <div style="font-size:11px;color:var(--muted);margin-top:2px">Check to stop all text messages to this employee</div>
              </div>
              <input type="checkbox" ${e.textBolt==='STOP'?'checked':''} onchange="state.editing.textBolt=this.checked?'STOP':(state.employees[state.editing._idx]?.textBolt&&state.employees[state.editing._idx].textBolt!=='STOP'?state.employees[state.editing._idx].textBolt:'')" style="width:18px;height:18px;cursor:pointer;accent-color:#c0392b">
            </label>
          </div>
        </div>

        </div><!-- end modal-details-pane -->
        ${!e._isNew ? `
        <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border)">
          <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--rust);margin-bottom:10px">HR File</div>
          <div id="driveLinkArea">
            <div style="font-size:12px;color:var(--muted)">Loading folder link…</div>
          </div>
        </div>
        ` : ''}


        </div><!-- end modal-body -->
        <div class="modal-footer">
          <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveEdit()">Save changes</button>
        </div>
      </div>
    </div>`;
}

function calcDollarPerM(wage){
  return wage * (1 + state.burden) / state.mhr;
}

function getEmpWage(name){
  const emp = state.employees.find(e=>e.name===name);
  if(!emp) return 0;
  const w = String(emp.wage||'').replace(/[$,]/g,'');
  return parseFloat(w)||0;
}

function renderEcon(){
  const burden = state.burden;
  const mhr = state.mhr;

  // Active non-SGA employees
  const eligible = state.employees.filter(e=>e.status==='Active' && e.dept!=='SG&A');

  // Find duplicates
  const nameCount = {};
  state.economics.forEach(p=>{ if(p.name) nameCount[p.name]=(nameCount[p.name]||0)+1; });
  const dupes = new Set(Object.keys(nameCount).filter(n=>nameCount[n]>1));

  // Unassigned = eligible employees not in any position
  const assignedNames = new Set(state.economics.map(p=>p.name).filter(Boolean));
  const unassigned = eligible.filter(e=>!assignedNames.has(e.name));

  const secs = [...new Set(state.economics.map(e=>e.section))];
  const totalWage = state.economics.reduce((s,p)=>s+(p.name?getEmpWage(p.name):0),0);
  const totalDpm = state.economics.reduce((s,p)=>s+(p.name?calcDollarPerM(getEmpWage(p.name)):0),0);

  // Build dropdown options — all eligible employees
  const empOptions = eligible.map(e=>`<option value="${e.name}">${e.name}</option>`).join('');

  // Build position rows
  const posRows = secs.map(sec=>{
    const positions = state.economics.filter(p=>p.section===sec);
    const hdr = `<div class="dept-header">${sec}</div>`;
    const rows = positions.map(p=>{
      const econIdx = state.economics.indexOf(p);
      const wage = p.name ? getEmpWage(p.name) : 0;
      const dpm = wage ? '$'+calcDollarPerM(wage).toFixed(2) : '—';
      const variance = (p.name && p.max) ? wage - p.max : null;
      const isOver = variance !== null && variance > 0;
      const isUnder = variance !== null && variance < 0;
      const varStr = variance === null ? '—' : (variance > 0 ? '+$'+variance.toFixed(2) : '-$'+Math.abs(variance).toFixed(2));
      const varCls = isOver ? 'var-over' : isUnder ? 'var-under' : 'var-even';
      const isDupe = p.name && dupes.has(p.name);
      const rowAlert = isDupe ? ' style="border-color:#e67e22;background:#fffbf5"' : '';

      return `<div class="pos-row"${rowAlert}>
        <div class="pos-num">${p.num}</div>
        <div class="pos-title">${p.position}</div>
        <div>
          <select class="pos-select${isDupe?' dupe-select':''}" onchange="econAssign(${econIdx},this.value)">
            <option value="">— unassigned —</option>
            ${eligible.map(e=>`<option value="${e.name}" ${p.name===e.name?'selected':''}>${e.name}</option>`).join('')}

        <div class="pos-dpm">${wage ? '$'+wage.toFixed(2) : '—'}</div>
        <div class="pos-dpm">${dpm}</div>
        <div class="pos-max">${p.max ? '$'+Number(p.max).toFixed(2) : '—'}</div>
        <div class="pos-var ${varCls}">${varStr}</div>
      </div>`;
    }).join('');
    return hdr + rows;
  }).join('');

  return `<style>

function econAssign(posIdx, name) {
  state.economics[posIdx].name = name;
  render();
}

function econUnassign(posIdx) {
  state.economics[posIdx].name = '';
  render();
}

async function saveEconomics() {
  try {
    for(const p of state.economics){
      if(p.id){
        await fetch('/api/data?table=economics&id='+p.id,{
          method:'PATCH', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({name:p.name||''})
        });
      }
    }
    toast('Staffing plan saved', 'success');
  } catch(e) { toast('Save failed: '+e.message, 'error'); }
}

function renderOTReport(){
  // Helper to get unique batches and their date ranges
  const batches = new Map();
  state.weeklyHours.forEach(r => {
    if (!batches.has(r.batchId)) {
      batches.set(r.batchId, { dates: [] });
    }
    batches.get(r.batchId).dates.push(r.date);
  });

  // Sort batches by most recent
  const sortedBatches = [...batches.entries()].sort((a, b) => {
    const aMax = Math.max(...a[1].dates.map(d => new Date(d)));
    const bMax = Math.max(...b[1].dates.map(d => new Date(d)));
    return bMax - aMax;
  });

  const selectedBatch = state.selectedOTBatch || (sortedBatches.length > 0 ? sortedBatches[0][0] : null);
  state.selectedOTBatch = selectedBatch;

  // Filter data for selected batch
  const batchData = selectedBatch ? state.weeklyHours.filter(r => r.batchId === selectedBatch) : [];

  // Get unique dates for selected batch
  const dates = [...new Set(batchData.map(r => r.date))].sort();
  const weekStart = dates.length > 0 ? dates[0] : '';
  const weekEnd = dates.length > 0 ? dates[dates.length - 1] : '';

  // Calculate totals by employee
  const empTotals = {};
  batchData.forEach(r => {
    if (!empTotals[r.empNum]) {
      empTotals[r.empNum] = { regular: 0, ot: 0 };
    }
    empTotals[r.empNum].regular += r.regular;
    empTotals[r.empNum].ot += r.ot;
  });

  // Calculate totals and dollar amounts
  let totalRegular = 0, totalOT = 0, totalRegularDollars = 0, totalOTDollars = 0;

  // Get pre-approved OT from overtime table (Weekend only) - per employee
  const preApprovedMap = {};
  let preApprovedHours = 0, preApprovedDollars = 0;
  state.ot.weekend.forEach(r => {
    const emp = state.employees.find(e => e.name === r.name);
    if (emp) {
      const wage = parseFloat(String(emp.wage).replace(/[$,]/g, '')) || 0;
      preApprovedMap[r.name] = {hours: r.hours, dollars: r.hours * wage * 1.5};
      preApprovedHours += r.hours;
      preApprovedDollars += r.hours * wage * 1.5;
    }
  });

  const employeeDetails = [];

  Object.entries(empTotals).forEach(([empNum, hrs]) => {
    const emp = state.employees.find(e => e.empNum == empNum);
    if (!emp) {
      employeeDetails.push({
        empNum, name: `UNMATCHED (#${empNum})`, regular: hrs.regular, ot: hrs.ot,
        wage: 0, regularDoll: 0, otDoll: 0,
        preApprovedOT: 0, variance: hrs.ot,
        matched: false
      });
      return;
    }

    const wage = parseFloat(String(emp.wage).replace(/[$,]/g, '')) || 0;
    const regularDoll = hrs.regular * wage;
    const otDoll = hrs.ot * wage * 1.5;

    totalRegular += hrs.regular;
    totalOT += hrs.ot;
    totalRegularDollars += regularDoll;
    totalOTDollars += otDoll;

    const preApp = preApprovedMap[emp.name] || {hours: 0, dollars: 0};
    employeeDetails.push({
      empNum, name: emp.name, regular: hrs.regular, ot: hrs.ot,
      wage, regularDoll, otDoll,
      preApprovedOT: preApp.hours,
      variance: hrs.ot - preApp.hours,
      matched: true
    });
  });

  // Calculate net OT
  const netOTHours = Math.max(0, totalOT - preApprovedHours);
  const netOTDollars = Math.max(0, totalOTDollars - preApprovedDollars);
  const totalPayroll = totalRegularDollars + totalOTDollars;

function copyTextBoltList() {
  const addresses = state.employees
    .filter(e =>
      e.status === 'Active' &&
      e.textBolt &&
      e.textBolt !== 'STOP' &&
      e.textBolt.includes('@')
    )
    .map(e => e.textBolt);

  if (!addresses.length) {
    toast('No active opted-in employees found', 'error');
    return;
  }

  const list = addresses.join(', ');
  navigator.clipboard.writeText(list).then(() => {
    const btn = document.getElementById('copyTBBtn');
    btn.textContent = '✓ Copied ' + addresses.length + ' addresses';
    btn.style.color = '#2a7a47';
    btn.style.borderColor = '#2a7a47';
    toast(addresses.length + ' TextBolt addresses copied to clipboard', 'success');
    setTimeout(() => {
      btn.textContent = '📋 Copy TextBolt list';
      btn.style.color = '';
      btn.style.borderColor = '';
    }, 3000);
  }).catch(() => {
    // Fallback for browsers that block clipboard
    const ta = document.createElement('textarea');
    ta.value = list;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast(addresses.length + ' addresses copied', 'success');
  });
}

async function parseOTFile(){
  const file=document.getElementById('otUploadFile').files[0];
  if(!file){toast('No file selected','error');return;}

  try{
    const rows=await parseExcelBuffer(file);
    if(!rows||rows.length===0){toast('No data found in file','error');return;}

    showOTFilePreview(rows);
  }catch(err){
    console.error('Parse error:',err);
    toast('Error parsing file: '+err.message,'error');
  }
}

async function parseExcelBuffer(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=(e)=>{
      try{
        if(window.XLSX){
          // Use base64 data URL approach which works for both XLS and XLSX
          const data=e.target.result;
          const base64=data.split(',')[1];
          console.log('File type:',file.name,'| Base64 length:',base64.length);

          const workbook=XLSX.read(base64,{type:'base64'});
          console.log('Sheet names:',workbook.SheetNames);

          const sheet=workbook.Sheets[workbook.SheetNames[0]];
          const rows=XLSX.utils.sheet_to_json(sheet);
          console.log('Rows parsed:',rows.length,'| First row keys:',rows.length>0?Object.keys(rows[0]):null);

          if(rows.length===0)throw new Error('No data found in file');

          // Find header columns by matching keys
          const firstRow=rows[0];
          const empNumKey=Object.keys(firstRow).find(k=>k.toLowerCase().includes('employee')||k.toLowerCase().includes('number'));
          const dateKey=Object.keys(firstRow).find(k=>k.toLowerCase().includes('date'));
          const regKey=Object.keys(firstRow).find(k=>k.toLowerCase().includes('regular'));
          const otKey=Object.keys(firstRow).find(k=>k.toLowerCase().includes('ot')||k.toLowerCase().includes('overtime'));
          const commKey=Object.keys(firstRow).find(k=>k.toLowerCase().includes('comment')||k.toLowerCase().includes('supervisor'));

          if(!empNumKey||!dateKey){
            console.error('Column search failed. Looking for:');
            console.error('  - empNumKey (has "employee" or "number"):', empNumKey);
            console.error('  - dateKey (has "date"):', dateKey);
            console.error('Available keys:', Object.keys(firstRow));
            throw new Error('Missing required columns: Employee Number or Date');
          }

          const result=[];
          rows.forEach(row=>{
            const empNumVal=String(row[empNumKey]||'').trim();
            const dateVal=String(row[dateKey]||'').trim();
            const regVal=parseFloat(row[regKey])||0;
            const otVal=parseFloat(row[otKey])||0;
            const commVal=String(row[commKey]||'').trim();

            if(!empNumVal||!dateVal)return;

            result.push({
              employee_number:empNumVal,
              work_date:dateVal,
              regular_hours:regVal,
              ot_hours:otVal,
              supervisor_comment:commVal
            });
          });

          if(result.length>0){
            resolve(result);
          }else{
            throw new Error('No valid data rows found');
          }
        }else{
          throw new Error('XLSX library not loaded');
        }
      }catch(xlsxErr){
        console.warn('XLSX parsing failed, trying CSV:',xlsxErr.message);
        try{
          const text=e.target.result;
          resolve(parseCSVText(text));
        }catch(csvErr){
          reject(new Error('Could not parse file - supported formats are XLS, XLSX, and CSV'));
        }
      }
    };
    reader.onerror=()=>reject(new Error('Failed to read file'));
    reader.readAsDataURL(file);
  });
}

function parseCSVText(text){
  const lines=text.split('\n').filter(l=>l.trim());
  if(lines.length<2)return[];

  let header=lines[0].split(/[,\t]/).map(h=>h.trim().toLowerCase());

  const empNumIdx=header.findIndex(h=>h.includes('employee')||h.includes('number'));
  const dateIdx=header.findIndex(h=>h.includes('date'));
  const regIdx=header.findIndex(h=>h.includes('regular'));
  const otIdx=header.findIndex(h=>h.includes('ot')||h.includes('overtime'));
  const commIdx=header.findIndex(h=>h.includes('comment')||h.includes('supervisor'));

  if(empNumIdx<0||dateIdx<0){
    throw new Error('Could not find Employee Number or Date columns');
  }

  const rows=[];
  for(let i=1;i<lines.length;i++){
    const parts=lines[i].split(/[,\t]/).map(p=>p.trim());
    if(parts.length<2||!parts[empNumIdx])continue;

    const empNum=String(parts[empNumIdx]).trim();
    if(!empNum)continue;

    rows.push({
      employee_number:empNum,
      work_date:parts[dateIdx]||'',
      regular_hours:parseFloat(parts[regIdx])||0,
      ot_hours:parseFloat(parts[otIdx])||0,
      supervisor_comment:commIdx>=0?parts[commIdx]:''
    });
  }

  return rows;
}

function showOTFilePreview(rows){
  const grouped={};
  rows.forEach(r=>{
    if(!grouped[r.employee_number])grouped[r.employee_number]=[];
    grouped[r.employee_number].push(r);
  });

  const unmatched=Object.keys(grouped).filter(en=>{
    return !state.employees.find(e=>e.empNum==en);
  });

  const html=`
    <div id="otPreview" style="position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000">
      <div style="background:var(--surface);border-radius:8px;padding:24px;max-width:600px;max-height:80vh;overflow-y:auto">
        <div style="font-size:16px;font-weight:700;margin-bottom:12px">Upload preview</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:16px">
          <div>Rows: ${rows.length}</div>
          <div>Employees: ${Object.keys(grouped).length}</div>
          <div>Date range: ${rows.map(r=>r.work_date).sort()[0]} to ${rows.map(r=>r.work_date).sort().pop()}</div>
        </div>

        ${unmatched.length>0?`
          <div style="background:#fef5e8;border:1px solid #e6b87f;border-radius:4px;padding:10px;margin-bottom:12px;font-size:11px">
            <div style="font-weight:700;color:#9a600a;margin-bottom:4px">⚠ Unmatched employee numbers (${unmatched.length})</div>
            <div style="color:#6b4a0a">${unmatched.join(', ')}</div>
          </div>
        `:''}

        <div style="background:var(--surface2);border-radius:4px;padding:12px;margin-bottom:16px;font-size:11px;max-height:200px;overflow-y:auto">
          <table style="font-size:10px;width:100%">
            <tr style="font-weight:700;border-bottom:1px solid var(--border)"><td style="padding:4px">Emp #</td><td style="padding:4px">Date</td><td style="padding:4px">Reg</td><td style="padding:4px">OT</td></tr>
            ${rows.slice(0,20).map(r=>`<tr><td style="padding:4px">${r.employee_number}</td><td style="padding:4px">${r.work_date}</td><td style="padding:4px;text-align:right">${r.regular_hours.toFixed(2)}</td><td style="padding:4px;text-align:right">${r.ot_hours.toFixed(2)}</td></tr>`).join('')}
            ${rows.length>20?`<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:4px">... and ${rows.length-20} more rows</td></tr>`:''}
          </table>
        </div>

        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button class="btn btn-outline btn-sm" onclick="document.getElementById('otPreview').remove();document.getElementById('otUploadForm').style.display='none'">Cancel</button>
          <button class="btn btn-primary btn-sm" id="otConfirmBtn">Confirm and upload</button>
        </div>
      </div>
    </div>
  `;

  document.body.insertAdjacentHTML('beforeend',html);
  window.otPreviewRows = rows;
  document.getElementById('otConfirmBtn').addEventListener('click', async function(){
    await confirmOTUpload(window.otPreviewRows);
  });
}

async function confirmOTUpload(rows){
  try{
    // Generate proper UUID format for uploadBatchId
    const uploadBatchId = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      const r = Math.random() * 16 | 0;
      const v = c === 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });

    document.getElementById('otPreview')?.remove();
    document.getElementById('otUploadForm').style.display='none';
    document.getElementById('otUploadFile').value='';

    toast('Uploading...','');

    const payload={uploadBatchId,rows};
    console.log('Sending to API:', JSON.stringify(payload).substring(0,200));

    const res=await fetch('/api/ot-upload',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });

    if(!res.ok){
      const err=await res.json();
      throw new Error(err.error||'Upload failed');
    }

    toast('Upload successful!','success');

    state.selectedOTBatch=uploadBatchId;
    await loadData();
    state.tab='otreport';
    render();
  }catch(err){
    console.error('Upload error:',err);
    toast('Upload failed: '+err.message,'error');
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

loadData();
